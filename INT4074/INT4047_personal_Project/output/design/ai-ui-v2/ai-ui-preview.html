<script>
const keys=['01', '02', '03', '04', '05', '06', '07', '08', '09'],names={'01': 'Today', '02': 'AI 診斷', '03': '知識地圖', '04': '計劃設置', '05': 'AI 學習計劃', '06': '課程', '07': '練習 + AI 提示', '08': 'AI 解釋錯誤', '09': 'Ask AI'};
let cur='02';
function go(k){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.dataset.k===k));
document.querySelectorAll('.nv').forEach(e=>e.classList.toggle('on',e.dataset.go===k));
document.getElementById('cap').textContent=k+' · '+names[k];cur=k;try{history.replaceState(null,'','#s'+k)}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
document.getElementById('pv').onclick=()=>go(keys[(keys.indexOf(cur)+keys.length-1)%keys.length]);
document.getElementById('nx').onclick=()=>go(keys[(keys.indexOf(cur)+1)%keys.length]);
document.getElementById('hl').onchange=e=>document.getElementById('ph').classList.toggle('show',e.target.checked);
const h=(location.hash||'').replace('#s','');go(keys.includes(h)?h:'02');
</script></body></html>
