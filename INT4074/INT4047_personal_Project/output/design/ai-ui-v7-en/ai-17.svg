s TC', 'Noto Sans CJK TC', sans-serif" font-size="13" font-weight="600" fill="#3e6550" text-anchor="start">Step 1: decimal sum = 150</text><text x="343" y="221" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="12" font-weight="500" fill="#3e6550" text-anchor="end">correct</text><rect x="29" y="244" width="332" height="44" rx="14" fill="#e6eee2" stroke="none" stroke-width="0"/><circle cx="52" cy="266" r="10" fill="#3e6550"/><text x="52" y="271" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text><text x="72" y="271" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="13" font-weight="600" fill="#3e6550" text-anchor="start">Step 2: range is −128 to 127</text><text x="343" y="271" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="12" font-weight="500" fill="#3e6550" text-anchor="end">2nd try</text><rect x="29" y="300" width="332" height="418" rx="22" fill="#ffffff" stroke="none" stroke-width="0"/><text x="47" y="328" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="12.5" font-weight="600" fill="#5b4fa6" text-anchor="start">Step 3</text><text x="47" y="356" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="17" font-weight="700" fill="#2d3230" text-anchor="start">Does 150 fit in this range?</text><rect x="47" y="372" width="144" height="46" rx="16" fill="#ffffff" stroke="#d5d6cf" stroke-width="1.2"/><text x="119" y="401" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="14" font-weight="600" fill="#2d3230" text-anchor="middle">It fits</text><rect x="199" y="372" width="144" height="46" rx="16" fill="#e6eee2" stroke="#3e6550" stroke-width="1.2"/><text x="271" y="401" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="14" font-weight="600" fill="#3e6550" text-anchor="middle">It doesn’t</text><rect x="47" y="432" width="296" height="82" rx="14" fill="#eceaf5" stroke="none" stroke-width="0"/><path d="M64,446 Q65.5,450.5 70,452 Q65.5,453.5 64,458 Q62.5,453.5 58,452 Q62.5,450.5 64,446Z" fill="none" stroke="#5b4fa6" stroke-width="1.2" stroke-linejoin="round"/><text x="78" y="456" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="12.5" font-weight="500" fill="#2f2a55" text-anchor="start">Right: 150 is more than 127.</text><text x="78" y="475" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="12.5" font-weight="500" fill="#2f2a55" text-anchor="start">The result 10010110 starts with 1,</text><text x="78" y="494" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="12.5" font-weight="500" fill="#2f2a55" text-anchor="start">so it is read as negative.</text><text x="47" y="542" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="14" font-weight="600" fill="#2f2a55" text-anchor="start">So, what is the answer?</text><rect x="47" y="556" width="296" height="48" rx="16" fill="#ffffff" stroke="#e2e3dc" stroke-width="1"/><text x="65" y="585" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="13" font-weight="700" fill="#2d3230" text-anchor="start">A</text><text x="91" y="585" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="13.5" font-weight="500" fill="#2d3230" text-anchor="start">150</text><rect x="47" y="608" width="296" height="48" rx="16" fill="#ffffff" stroke="#e2e3dc" stroke-width="1"/><text x="65" y="637" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="13" font-weight="700" fill="#2d3230" text-anchor="start">B</text><text x="91" y="637" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="13.5" font-weight="500" fill="#2d3230" text-anchor="start">−106</text><rect x="47" y="660" width="296" height="48" rx="16" fill="#e6eee2" stroke="#3e6550" stroke-width="1"/><text x="65" y="689" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="13" font-weight="700" fill="#3e6550" text-anchor="start">C</text><text x="91" y="689" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="13.5" font-weight="500" fill="#3e6550" text-anchor="start">Overflow, result is wrong</text><rect x="29" y="734" width="332" height="48" rx="24.0" fill="#3e6550" stroke="none" stroke-width="0"/><text x="195.0" y="763.0" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Confirm answer</text><rect x="150" y="826" width="90" height="4" rx="2" fill="#2d3230" stroke="none" stroke-width="0"/></g></svg>