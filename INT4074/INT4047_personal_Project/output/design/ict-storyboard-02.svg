<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3c6352"/></marker></defs><rect width="1700" height="1150" fill="#f8f9f5"/><text x="65" y="62" font-family="Arial" font-size="34" font-weight="700" fill="#29332e">02 / One question, feedback and durable history</text><text x="65" y="96" font-family="Arial" font-size="19" fill="#718176">Storyboard · assessment and failure branches · objective marking and written self-assessment remain separate</text><polyline points="270,260 270,305" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="270,415 270,460" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="450,522 640,522" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="820,460 820,365 450,365" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="270,585 270,655" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="450,717 640,717" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="270,780 270,865" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="450,927 640,927" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="820,780 820,865" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1000,927 1200,927" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1380,865 1380,780" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1380,655 1380,585" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1380,655 1380,620 1080,620 1080,210 1000,210" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,210 535,210 535,275 270,275 270,305" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1560,522 1630,522 1630,1050 35,1050 35,360 90,360" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1380,460 1380,430" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1200,367 1120,367 1120,137 270,137 270,150" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1380,305 1380,260" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><g id="question"><polygon points="112,150 450,150 428,260 90,260" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="270.0" y="198.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">A / O: Present a question</text><text x="270.0" y="226.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Foundation → application → challenge</text></g><g id="answer"><polygon points="112,305 450,305 428,415 90,415" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="270.0" y="353.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Answer + Submit</text><text x="270.0" y="381.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Optional confidence and hint</text></g><g id="valid"><polygon points="270.0,460 450,522.5 270.0,585 90,522.5" fill="#f1eadc" stroke="#b3c0b0" stroke-width="1.5"/><text x="270.0" y="515.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">Valid answer?</text><text x="270.0" y="543.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Non-empty; numeric if required</text></g><g id="invalid"><polygon points="662,460 1000,460 978,585 640,585" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="820.0" y="515.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">O: Prompt for a valid answer</text><text x="820.0" y="543.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">No attempt is recorded</text></g><g id="type"><polygon points="270.0,655 450,717.5 270.0,780 90,717.5" fill="#f1eadc" stroke="#b3c0b0" stroke-width="1.5"/><text x="270.0" y="724.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">Written explanation?</text></g><g id="objective"><rect x="640" y="655" width="360" height="125" rx="16" fill="#ffffff" stroke="#b3c0b0" stroke-width="1.5"/><text x="820.0" y="710.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">Grade objective response</text><text x="820.0" y="738.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">MCQ / number / reference match</text></g><g id="written"><rect x="90" y="865" width="360" height="125" rx="16" fill="#ffffff" stroke="#b3c0b0" stroke-width="1.5"/><text x="270.0" y="920.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">Record raw written response</text><text x="270.0" y="948.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">correct = null; pending review</text></g><g id="prepare"><rect x="640" y="865" width="360" height="125" rx="16" fill="#ffffff" stroke="#b3c0b0" stroke-width="1.5"/><text x="820.0" y="920.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">Create an attempt event</text><text x="820.0" y="948.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Keep answer, time, hint and retry flags</text></g><g id="persist"><rect x="1200" y="865" width="360" height="125" rx="16" fill="#e8e5f1" stroke="#b3c0b0" stroke-width="1.5"/><path d="M1203,890 Q1380.0,913 1557,890" fill="none" stroke="#b3c0b0"/><text x="1380.0" y="920.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">Write to browser-local history</text><text x="1380.0" y="948.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">IndexedDB → localStorage fallback</text></g><g id="saved"><polygon points="1380.0,655 1560,717.5 1380.0,780 1200,717.5" fill="#f1eadc" stroke="#b3c0b0" stroke-width="1.5"/><text x="1380.0" y="724.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">Save succeeded?</text></g><g id="failure"><polygon points="662,150 1000,150 978,275 640,275" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="820.0" y="205.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">O: Storage error + retry guidance</text><text x="820.0" y="233.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Retain draft; roll back this attempt</text></g><g id="feedback"><polygon points="1222,460 1560,460 1538,585 1200,585" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="1380.0" y="501.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">O: Feedback in the same position</text><text x="1380.0" y="529.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Written: reference points + optional</text><text x="1380.0" y="557.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">self-assessment, saved separately</text></g><g id="more"><polygon points="1380.0,305 1560,367.5 1380.0,430 1200,367.5" fill="#f1eadc" stroke="#b3c0b0" stroke-width="1.5"/><text x="1380.0" y="360.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">More questions?</text><text x="1380.0" y="388.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">I: Next / Finish</text></g><g id="finish"><rect x="1200" y="150" width="360" height="110" rx="55.0" fill="#ffffff" stroke="#b3c0b0" stroke-width="1.5"/><text x="1380.0" y="198.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">B / Continue on page 03</text><text x="1380.0" y="226.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Finish the practice session</text></g><rect x="521" y="484" width="25.0" height="25" rx="4" fill="#f8f9f5"/><text x="525" y="502" font-family="Arial" font-size="17" fill="#3c6352">No</text><rect x="506" y="327" width="118.5" height="25" rx="4" fill="#f8f9f5"/><text x="510" y="345" font-family="Arial" font-size="17" fill="#3c6352">Correct input</text><rect x="288" y="605" width="33.5" height="25" rx="4" fill="#f8f9f5"/><text x="292" y="623" font-family="Arial" font-size="17" fill="#3c6352">Yes</text><rect x="529" y="682" width="25.0" height="25" rx="4" fill="#f8f9f5"/><text x="533" y="700" font-family="Arial" font-size="17" fill="#3c6352">No</text><rect x="288" y="802" width="33.5" height="25" rx="4" fill="#f8f9f5"/><text x="292" y="820" font-family="Arial" font-size="17" fill="#3c6352">Yes</text><rect x="1396" y="606" width="33.5" height="25" rx="4" fill="#f8f9f5"/><text x="1400" y="624" font-family="Arial" font-size="17" fill="#3c6352">Yes</text><rect x="1096" y="567" width="25.0" height="25" rx="4" fill="#f8f9f5"/><text x="1100" y="585" font-family="Arial" font-size="17" fill="#3c6352">No</text><rect x="531" y="277" width="280.0" height="25" rx="4" fill="#f8f9f5"/><text x="535" y="295" font-family="Arial" font-size="17" fill="#3c6352">Retry after storage is available</text><rect x="446" y="1057" width="424.5" height="25" rx="4" fill="#f8f9f5"/><text x="450" y="1075" font-family="Arial" font-size="17" fill="#3c6352">I: Retry a wrong objective answer (a new attempt)</text><rect x="1396" y="432" width="67.5" height="25" rx="4" fill="#f8f9f5"/><text x="1400" y="450" font-family="Arial" font-size="17" fill="#3c6352">I: Next</text><rect x="506" y="111" width="373.5" height="25" rx="4" fill="#f8f9f5"/><text x="510" y="129" font-family="Arial" font-size="17" fill="#3c6352">Yes: advance to next item; start at the top</text><rect x="1396" y="271" width="25.0" height="25" rx="4" fill="#f8f9f5"/><text x="1400" y="289" font-family="Arial" font-size="17" fill="#3c6352">No</text><text x="480" y="1025" font-family="Arial" font-size="18" fill="#718176">Hint opens and retries are recorded separately from an unassisted first answer. No data is sent to AI.</text><text x="65" y="1120" font-family="Arial" font-size="17" fill="#718176">Symbols: pill = start / connector · rectangle = process · parallelogram = I/O · diamond = decision · cylinder = stored data · dashed = future</text></svg>