2" stroke="none" stroke-width="0"/><rect x="289" y="226" width="30" height="20" rx="4" fill="#3f4642" stroke="none" stroke-width="0"/><text x="49" y="300" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="22" font-weight="700" fill="#dfe6dc" text-anchor="start">1111 1110</text><text x="49" y="322" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="14" font-weight="600" fill="#9fb7a4" text-anchor="start">= −2</text><circle cx="300" cy="288" r="24" fill="#ffffff"/><path d="M293,277 L310,288 L293,299 Z" fill="#2d3230"/><text x="49" y="362" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="11" font-weight="400" fill="#c9cfc6" text-anchor="start">2:14 · YouTube · 二補數 3 分鐘入門</text><rect x="29" y="392" width="332" height="86" rx="18" fill="#eceaf5" stroke="none" stroke-width="0"/><path d="M50,406 Q51.5,412.5 58,414 Q51.5,415.5 50,422 Q48.5,415.5 42,414 Q48.5,412.5 50,406Z" fill="none" stroke="#5b4fa6" stroke-width="1.4" stroke-linejoin="round"/><text x="66" y="418" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="12" font-weight="650" fill="#2f2a55" text-anchor="start">AI 提醒你</text><text x="47" y="440" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="11.5" font-weight="400" fill="#5a5480" text-anchor="start">你上次把最高位（符號位）當成數值位。</text><text x="47" y="457" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="11.5" font-weight="400" fill="#5a5480" text-anchor="start">這次請特別留意第 2 點。</text><text x="29" y="508" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto Sans CJK TC', sans-serif" font-size="17" font-weight="700" fill="#2d3230" text-anchor="start">Three things to know.</text><rect x="29" y="522" width="332" height="48" rx="16" fill="#ffffff" stroke="none" stroke-width="0"/><text x="47" y="551" font-family="Inter, 'SF Pro', 'Noto Sans TC', 'Noto S