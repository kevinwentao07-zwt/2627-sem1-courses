<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3c6352"/></marker></defs><rect width="1700" height="1150" fill="#f8f9f5"/><text x="65" y="62" font-family="Arial" font-size="34" font-weight="700" fill="#29332e">03 / Complete, review and export the evidence</text><text x="65" y="96" font-family="Arial" font-size="19" fill="#718176">Storyboard · results and I/O · browser-local storage is implemented; remote AI analysis is a future extension</text><polyline points="250,240 250,305" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="250,435 250,495" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="430,370 635,370" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="430,557 535,557 535,395 635,395" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="840,435 840,495" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="840,620 840,680" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1045,742 1210,742" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1390,680 1390,620" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1390,495 1390,435" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1570,557 1620,557 1620,935 1570,935" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1390,880 1390,805" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1390,305 1390,250" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/><polyline points="490,873 570,873 570,775 635,775" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="490,950 1140,950 1140,790 1210,790" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><g id="end"><rect x="70" y="150" width="360" height="90" rx="45.0" fill="#ffffff" stroke="#b3c0b0" stroke-width="1.5"/><text x="250.0" y="202.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">B / Practice session finished</text></g><g id="explored"><polygon points="250.0,305 430,370.0 250.0,435 70,370.0" fill="#f1eadc" stroke="#b3c0b0" stroke-width="1.5"/><text x="250.0" y="377.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">Explore step visited?</text></g><g id="explore"><polygon points="92,495 430,495 408,620 70,620" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="250.0" y="550.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Return to Explore</text><text x="250.0" y="578.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: Interactive learning example</text></g><g id="complete"><rect x="635" y="305" width="410" height="130" rx="16" fill="#ffffff" stroke="#b3c0b0" stroke-width="1.5"/><text x="840.0" y="349.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">Complete the lesson</text><text x="840.0" y="377.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">First completion: +60 XP / +30 points</text><text x="840.0" y="405.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Repeat practice: no extra reward</text></g><g id="result"><polygon points="657,495 1045,495 1023,620 635,620" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="840.0" y="536.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">O: Session result</text><text x="840.0" y="564.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">First-answer score, active time and</text><text x="840.0" y="592.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">question-by-question review</text></g><g id="record"><polygon points="657,680 1045,680 1023,805 635,805" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="840.0" y="721.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">C / I: Open complete learning record</text><text x="840.0" y="749.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: Topic summaries + review links</text><text x="840.0" y="777.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">[UI 12–13]</text></g><g id="export"><polygon points="1232,680 1570,680 1548,805 1210,805" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="1390.0" y="735.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Export learning data (JSON)</text><text x="1390.0" y="763.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Read all saved events and sessions</text></g><g id="read"><polygon points="1390.0,495 1570,557.5 1390.0,620 1210,557.5" fill="#f1eadc" stroke="#b3c0b0" stroke-width="1.5"/><text x="1390.0" y="564.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">Full history readable?</text></g><g id="download"><polygon points="1232,305 1570,305 1548,435 1210,435" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="1390.0" y="349.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">O: Download versioned JSON</text><text x="1390.0" y="377.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Events + question definitions +</text><text x="1390.0" y="405.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">current and archived sessions</text></g><g id="fail"><polygon points="1232,880 1570,880 1548,995 1210,995" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="1390.0" y="930.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">O: Export error / retry</text><text x="1390.0" y="958.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Do not download incomplete history</text></g><g id="future"><rect x="1210" y="150" width="360" height="100" rx="16" fill="#f1f2ef" stroke="#b3c0b0" stroke-width="1.5" stroke-dasharray="8 6"/><text x="1390.0" y="193.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">FUTURE / manual hand-off</text><text x="1390.0" y="221.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">AI or teacher analysis of exported data</text></g><g id="store"><rect x="70" y="760" width="420" height="225" rx="16" fill="#e8e5f1" stroke="#b3c0b0" stroke-width="1.5"/><path d="M73,785 Q280.0,808 487,785" fill="none" stroke="#b3c0b0"/><text x="280.0" y="823.5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">Browser-local learning history</text><text x="280.0" y="851.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Question ID / source / difficulty</text><text x="280.0" y="879.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Answer / marking / timestamps</text><text x="280.0" y="907.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Hint / confidence / active time</text><text x="280.0" y="935.5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">First attempt / retries / self-assessment</text></g><rect x="266" y="457" width="25.0" height="25" rx="4" fill="#f8f9f5"/><text x="270" y="475" font-family="Arial" font-size="17" fill="#3c6352">No</text><rect x="506" y="332" width="33.5" height="25" rx="4" fill="#f8f9f5"/><text x="510" y="350" font-family="Arial" font-size="17" fill="#3c6352">Yes</text><rect x="461" y="571" width="118.5" height="25" rx="4" fill="#f8f9f5"/><text x="465" y="589" font-family="Arial" font-size="17" fill="#3c6352">Visit Explore</text><rect x="856" y="457" width="161.0" height="25" rx="4" fill="#f8f9f5"/><text x="860" y="475" font-family="Arial" font-size="17" fill="#3c6352">Persist completion</text><rect x="856" y="640" width="135.5" height="25" rx="4" fill="#f8f9f5"/><text x="860" y="658" font-family="Arial" font-size="17" fill="#3c6352">I: View records</text><rect x="1096" y="702" width="59.0" height="25" rx="4" fill="#f8f9f5"/><text x="1100" y="720" font-family="Arial" font-size="17" fill="#3c6352">Export</text><rect x="1406" y="460" width="33.5" height="25" rx="4" fill="#f8f9f5"/><text x="1410" y="478" font-family="Arial" font-size="17" fill="#3c6352">Yes</text><rect x="1626" y="737" width="25.0" height="25" rx="4" fill="#f8f9f5"/><text x="1630" y="755" font-family="Arial" font-size="17" fill="#3c6352">No</text><rect x="1406" y="830" width="50.5" height="25" rx="4" fill="#f8f9f5"/><text x="1410" y="848" font-family="Arial" font-size="17" fill="#3c6352">Retry</text><rect x="1406" y="267" width="118.5" height="25" rx="4" fill="#f8f9f5"/><text x="1410" y="285" font-family="Arial" font-size="17" fill="#3c6352">Not connected</text><rect x="516" y="907" width="152.5" height="25" rx="4" fill="#f8f9f5"/><text x="520" y="925" font-family="Arial" font-size="17" fill="#3c6352">O: Read summaries</text><rect x="636" y="957" width="237.5" height="25" rx="4" fill="#f8f9f5"/><text x="640" y="975" font-family="Arial" font-size="17" fill="#3c6352">Read complete event history</text><text x="665" y="170" font-family="Arial" font-size="21" fill="#718176">EVIDENCE RULES</text><text x="665" y="205" font-family="Arial" font-size="18" fill="#718176">Written self-assessment is not an official DSE mark.</text><text x="665" y="238" font-family="Arial" font-size="18" fill="#718176">Accuracy is shown with its question sample size.</text><text x="665" y="271" font-family="Arial" font-size="18" fill="#718176">No login, cloud sync or automatic AI analysis yet.</text><text x="665" y="880" font-family="Arial" font-size="17" fill="#718176">Completion save failure: roll back progress and rewards, then retry.</text><text x="665" y="1042" font-family="Arial" font-size="18" fill="#718176">Navigating away preserves Learn position; active question timing pauses until the view becomes visible again.</text><text x="65" y="1120" font-family="Arial" font-size="17" fill="#718176">Symbols: pill = start / connector · rectangle = process · parallelogram = I/O · diamond = decision · cylinder = stored data · dashed = future</text></svg>