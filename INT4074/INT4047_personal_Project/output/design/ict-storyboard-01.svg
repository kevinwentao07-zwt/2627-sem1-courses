<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3c6352"/></marker></defs><rect width="1700" height="1150" fill="#f8f9f5"/><text x="65" y="62" font-family="Arial" font-size="34" font-weight="700" fill="#29332e">01 / A learning journey with a clear return path</text><text x="65" y="96" font-family="Arial" font-size="19" fill="#718176">Storyboard · navigation and screen transitions · I = learner input · O = software output</text><polyline points="240,245 240,290" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="240,400 240,440" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="240,550 240,590" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="240,700 240,740" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="240,850 240,890" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="415,945 625,945" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,890 800,850" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,740 800,700" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,590 800,550" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1565,210 1610,210 1610,520 1565,520" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1390,415 1390,455" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1390,585 1390,640 1120,640 1120,945 975,945" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1390,815 1390,890" fill="none" stroke="#3c6352" stroke-width="2" marker-end="url(#arrow)"/><g id="start"><rect x="65" y="155" width="310" height="90" rx="45.0" fill="#ffffff" stroke="#b3c0b0" stroke-width="1.5"/><text x="220.0" y="193.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">START</text><text x="220.0" y="221.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Open the browser preview</text></g><g id="home"><rect x="65" y="290" width="350" height="110" rx="16" fill="#ffffff" stroke="#b3c0b0" stroke-width="1.5"/><text x="240.0" y="338.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">O: Home [UI 01]</text><text x="240.0" y="366.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Journey, level and points</text></g><g id="learn"><polygon points="87,440 415,440 393,550 65,550" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="240.0" y="488.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Tap Learn</text><text x="240.0" y="516.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: Curriculum library [UI 02]</text></g><g id="module"><polygon points="87,590 415,590 393,700 65,700" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="240.0" y="638.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Select Module A</text><text x="240.0" y="666.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: Four topics [UI 03–04]</text></g><g id="topic"><polygon points="87,740 415,740 393,850 65,850" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="240.0" y="788.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Select A1 / A2 / A3 / A4</text><text x="240.0" y="816.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: Textbook lesson list [UI 05]</text></g><g id="lesson"><polygon points="87,890 415,890 393,1000 65,1000" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="240.0" y="938.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Select a micro-lesson</text><text x="240.0" y="966.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: Restore its saved session</text></g><g id="learnstep"><rect x="625" y="890" width="350" height="110" rx="16" fill="#ffffff" stroke="#b3c0b0" stroke-width="1.5"/><text x="800.0" y="938.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">O: Learn [UI 06]</text><text x="800.0" y="966.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Three key ideas + one situation</text></g><g id="explore"><polygon points="647,740 975,740 953,850 625,850" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="800.0" y="788.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Manipulate the example</text><text x="800.0" y="816.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: Explore response [UI 07]</text></g><g id="check"><polygon points="647,590 975,590 953,700 625,700" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="800.0" y="638.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Open Check [UI 08–09]</text><text x="800.0" y="666.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: 6–10 graded practice items</text></g><g id="a"><rect x="625" y="440" width="350" height="110" rx="55.0" fill="#ffffff" stroke="#b3c0b0" stroke-width="1.5"/><text x="800.0" y="488.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">A / Continue on page 02</text><text x="800.0" y="516.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Submit, feedback and persistence</text></g><g id="plan"><polygon points="1237,155 1565,155 1543,265 1215,265" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="1390.0" y="203.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Tap Plan</text><text x="1390.0" y="231.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: Next lesson / review [UI 10]</text></g><g id="settings"><polygon points="1237,305 1565,305 1543,415 1215,415" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="1390.0" y="353.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Tap Settings</text><text x="1390.0" y="381.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: Study preferences [UI 11]</text></g><g id="return"><polygon points="1237,455 1565,455 1543,585 1215,585" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="1390.0" y="499.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Tap Learn again</text><text x="1390.0" y="527.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: Restore the previous Learn view</text><text x="1390.0" y="555.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">with its step and scroll position</text></g><g id="records"><polygon points="1237,705 1565,705 1543,815 1215,815" fill="#e4eddf" stroke="#b3c0b0" stroke-width="1.5"/><text x="1390.0" y="753.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">I: Open learning notes</text><text x="1390.0" y="781.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">O: Learning history [UI 12–13]</text></g><g id="b"><rect x="1215" y="890" width="350" height="110" rx="55.0" fill="#ffffff" stroke="#b3c0b0" stroke-width="1.5"/><text x="1390.0" y="938.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="600" fill="#29332e">C / Continue on page 03</text><text x="1390.0" y="966.0" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" fill="#29332e">Learning record and JSON export</text></g><rect x="476" y="909" width="101.5" height="25" rx="4" fill="#f8f9f5"/><text x="480" y="927" font-family="Arial" font-size="17" fill="#3c6352">Open lesson</text><rect x="813" y="855" width="67.5" height="25" rx="4" fill="#f8f9f5"/><text x="817" y="873" font-family="Arial" font-size="17" fill="#3c6352">Explore</text><rect x="813" y="705" width="50.5" height="25" rx="4" fill="#f8f9f5"/><text x="817" y="723" font-family="Arial" font-size="17" fill="#3c6352">Check</text><rect x="1111" y="662" width="220.5" height="25" rx="4" fill="#f8f9f5"/><text x="1115" y="680" font-family="Arial" font-size="17" fill="#3c6352">Return to last Learn view</text><text x="650" y="175" font-family="Arial" font-size="21" fill="#718176">NAVIGATION RULES</text><text x="650" y="220" font-family="Arial" font-size="18" fill="#718176">Switching the main tab preserves the Learn view.</text><text x="650" y="256" font-family="Arial" font-size="18" fill="#718176">Explicit Back moves up the curriculum hierarchy.</text><text x="650" y="292" font-family="Arial" font-size="18" fill="#718176">Submitting an answer keeps the current scroll position.</text><text x="650" y="328" font-family="Arial" font-size="18" fill="#718176">Next question begins at the top of the question view.</text><text x="65" y="1048" font-family="Arial" font-size="18" fill="#718176">Scope: Module A has 30 micro-lessons and 242 items. Home, Plan and account details include demonstration content.</text><text x="65" y="1120" font-family="Arial" font-size="17" fill="#718176">Symbols: pill = start / connector · rectangle = process · parallelogram = I/O · diamond = decision · cylinder = stored data · dashed = future</text></svg>