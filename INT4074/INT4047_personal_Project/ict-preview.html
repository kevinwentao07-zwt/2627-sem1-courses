}

}function back(p='home'){return `<button class="back" onclick="go('${p}')">${icon('back')} Back</button>`}function toast(t){document.getElementById('notice').innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>document.getElementById('notice').innerHTML='',2600)}function resetDemo(){learnView=null;planEpoch++;planData=null;planLoading=false;planError='';state={...initial,done:[]};save();go('home')}function nav(){document.getElementById('nav').innerHTML=['home','learn','plan','settings'].map(n=>`<button class="${(page===n||(n==='learn'&&isLearnPage(page)))?'active':''}" onclick="goTab('${n}')" aria-label="${n}" ${(page===n||(n==='learn'&&isLearnPage(page)))?'aria-current="page"':''}>${icon(n)}<small>${n[0].toUpperCase()+n.slice(1)}</small></button>`).join('');document.getElementById('nav').classList.toggle('hidden',!state.logged)}

const topics=[['A','Information Processing','Data, representation and analysis'],['B','Computer Systems','Hardware and system software'],['C','Internet & Applications','Networks, web and internet services'],['D','Computational Thinking','Problem solving and programming'],['E','Social Implications','Ethics, security and digital citizenship']];const electives=[['DB','Databases','Relational concepts · SQL · Design'],['AP','Algorithm & Programming','Algorithms · Programming'],['WA','Web Application Development','Web design · Web programming']];
function learn(){return `<p class="eyebrow">YOUR LIBRARY</p><h1>Learn</h1><p class="sub">A clear path through ICT.<br>選一份地圖，從自己的進度出發。</p><div class="seg">${['Compulsory','Elective'].map(t=>`<button class="${tab===t?'selected':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div><input class="search" aria-label="搜尋主題" placeholder="⌕  Search a topic" oninput="searchTopics(this.value)"><div id="topics">${topicList('')}</div><p class="footer-note">A 資訊處理已開放 ${aLessons.length} 節互動微課，可自由試讀。<br>其他模組仍沿用原有框架與準備度測驗。</p>`}function topicList(q){return (tab==='Compulsory'?topics:electives).filter(t=>t.join(' ').toLowerCase().includes(q.toLowerCase())).map(t=>`<button class="listbtn" onclick="selectMap('${t[1]}')"><span class="letter">${t[0]}</span><span class="label"><h3>${t[1]}</h3><p>${t[2]}</p></span><span class="arrow">→</span></button>`).join('')||'<p class="sub">找不到這個主題。</p>'}function searchTopics(q){document.getElementById('topics').innerHTML=topicList(q)}function selectMap(name){if(name==='Information Processing'){openModuleA();return}pendingMap=name;if(name.toLowerCase()===state.map.toLowerCase()){go('home');toast('已返回這份地圖的目前節點')}else{modal(`<p class="eyebrow">CHOOSE YOUR MAP</p><h2>${name}</h2><p class="sub">可以先查看地圖框架。要進入其他章節，先做 5 題簡短測驗，答對 4 題即可解鎖。</p>${button('查看這份地圖',"closeModal();go('framework')")}${button('開始準備度測驗',"closeModal();startJump()",'link')}`)}}
function framework(){return back('learn')+`<p class="eyebrow">MAP OVERVIEW</p><h1>${pendingMap}</h1><p class="sub">了解這份地圖會探索什麼。</p>${['生活情境與基本概念','互動探索','實踐任務','章節挑戰'].map((s,i)=>`<div class="listbtn"><span class="letter">0${i+1}</span><div class="label"><h3>${s}</h3><p>依序完成地圖節點</p></div>${icon('lock')}</div>`).join('')}<div class="card quiet"><h3>Ready for this chapter?</h3><p class="sub">通過準備度測驗，才會切換到這份地圖。</p>${button('Start readiness check',"startJump()")}</div>`}
function profile(){return back()+`<div class="profile"><div class="avatar">${icon('user')}</div><h2>${escapeHTML(state.name)}</h2><span class="tiny">Lv. ${level()} · ICT Explorer</span></div><div class="card"><p class="eyebrow">YOUR PROGRESS</p><div class="stats"><div><strong>${state.points.toLocaleString()}</strong><span class="tiny">Points</span></div><div><strong style="font-size:20px">${state.xp%1000} / 1,000</strong><span class="tiny">XP to level ${level()+1}</span></div></div><div class="progress"><i style="width:${state.xp%1000/10}%"></i></div></div><button class="chapter" onclick="go('collection')"><h2>Collection wall <span style="float:right">→</span></h2><p>${state.newUser?state.done.length:8+state.done.length} earned · ${state.newUser?state.featured.length||state.done.length:3} featured</p>${shelf()}</button><p class="eyebrow" style="margin-top:28px">YOUR JOURNEY</p><p>${state.newUser?state.done.length:14+state.done.length} missions completed</p><p>${state.newUser?(state.done.includes('wifi')?1:0):2} monthly challenge badges</p><p class="footer-note">Every small step deserves a place.</p>`}function shelf(){let objects=state.newUser?(state.done.includes('ram')?[['ram','RAM']]:[]):[['cpu','CPU'],['ram','RAM'],['medal','SQL Explorer']];if(state.featured?.length)objects=state.featured;return `<div class="objects">${objects.map(([i,l])=>`<div class="object">${icon(i)}<small>${l}</small></div>`).join('')||'<small class="tiny">Your showcase starts here.</small>'}</div>`}
function featureCollectible(i,l){let base=state.featured?.length?state.featured:(state.newUser?[]:[['cpu','CPU'],['ram','RAM'],['medal','SQL Explorer']]);state.featured=[...base.filter(o=>o[0]!==i).slice(-2),[i,l]];save();closeModal();render();toast('已更新展示架')}
function collection(){let empty=state.newUser&&!state.done.length;return back('profile')+`<p class="eyebrow">${empty?'YOUR FIRST COLLECTION':'A RECORD OF YOUR JOURNEY'}</p><h1>Collection wall</h1><p class="sub">${empty?'Lv. 1 · 0 points · 0 collected':`${state.newUser?state.done.length:8+state.done.length} collected · Choose what to display.`}</p>${empty?`<div class="shelf" style="height:230px;display:grid;place-items:center;text-align:center"><div style="color:#bbc2b3">${icon('cpu')}<p class="tiny">Your showcase starts here.</p></div></div><h2 style="margin-top:28px">Earn your first component.</h2><p class="sub">完成第一個硬件任務，<br>為你的電腦收藏第一個部件。</p>${button('Go to my learning map',"go('home')")}`:`<div class="shelf"><p class="eyebrow">YOUR SHOWCASE</p>${shelf()}</div><div class="pillrow">${['All','Hardware','Milestones'].map(f=>`<button class="${filter===f?'on':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><div class="grid">${[['cpu','Processor','Unlocked · Core power','Hardware'],['ram','Memory','Unlocked · Workspace','Hardware'],['ssd','Storage','Unlocked · Save it','Hardware'],['lock','Graphics card','Complete graphics mission','Hardware'],['medal','SQL Explorer','Library mission badge','Milestones'],['wifi','Campus connected','Monthly challenge badge','Milestones']].filter(t=>filter==='All'||t[3]===filter).map(([i,l,s])=>`<button class="tile ${i==='lock'?'locked':''}" onclick="showCollectible('${i}','${l}')">${icon(i)}<h3>${l}</h3><small>${s}</small></button>`).join('')}</div>`}`}
function showCollectible(i,l){modal(`<p class="eyebrow">YOUR COLLECTION</p><div style="margin:25px 0">${icon(i)}</div><h2>${l}</h2><p class="sub">${i==='lock'?'完成顯示卡任務後解鎖這件收藏。':'每件收藏都記錄了一次學習成果。可以把最喜歡的部件放上展示架。'}</p>${button(i==='lock'?'回到學習地圖':'展示這件收藏',i==='lock'?"closeModal();go('home')":`featureCollectible('${i}','${l}')`)}`)}
// Change mode to "api" only after deploying the authenticated backend described in plan-api.md.
const PLAN_CONFIG={mode:'demo',baseUrl:'/api/v1'};
let planData=null,planLoading=false,planError='',planBusy=false,planEpoch=0;
const planDemo=()=>({date:new Date().toLocaleDateString('en-CA'),goalMinutes:15,usedMinutes:0,items:[{id:'review-ram',type:'review',title:'Memory · RAM',subtitle:'工作空間與永久儲存',minutes:3,dueAt:new Date().toISOString(),status:'pending',route:'review'},{id:'review-io',type:'review',title:'Input & output',subtitle:'快速喚醒已學概念',minutes:2,dueAt:new Date().toISOString(),status:'pending',route:'review'},{id:'learn-ram',type:'learn',title:'Inside your computer',subtitle:'探索 RAM 如何幫助多工',minutes:7,status:'pending',route:'hardware'},{id:'check-ram',type:'practice',title:'A quick check',subtitle:'用一道情境題確認理解',minutes:3,status:'pending',route:'practice'}],insights:{status:'ready',generatedAt:new Date().toISOString(),summary:'把今天的重點留給記憶體。',note:'先複習，再探索；用練習驗證概念。',evidenceCount:6,knowledge:[{id:'io',label:'Input & output',status:'familiar',evidence:'3 次練習答對，仍需定期複習。'},{id:'ram',label:'Memory · RAM',status:'review',evidence:'曾混淆 RAM 與儲存裝置；建議今天複習。'},{id:'cpu',label:'Processor · CPU',status:'insufficient',evidence:'作答資料不足，暫不判斷掌握程度。'}]}});
async function planRequest(path,method='GET',body){const response=await fetch(PLAN_CONFIG.baseUrl+path,{method,credentials:'same-origin',headers:{'Accept':'application/json',...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!response.ok)throw new Error(response.status===401?'請重新登入以取得學習安排。':'暫時無法更新學習安排，請稍後重試。');return response.json()}
function validatePlan(data){if(!data||!Array.isArray(data.items)||!data.insights||!Array.isArray(data.insights.knowledge))throw new Error('安排資料格式不完整，請稍後重試。');if(!data.items.every(i=>typeof i.id==='string'&&typeof i.title==='string'&&typeof i.minutes==='number'&&i.minutes>=0))throw new Error('安排資料格式不完整。');return data}
async function loadPlan(){if(planLoading)return;const epoch=planEpoch;planLoading=true;planError='';if(page==='plan')render();try{const data=PLAN_CONFIG.mode==='demo'?(state.todayPlan?.date===new Date().toLocaleDateString('en-CA')?state.todayPlan:planDemo()):await planRequest('/plan/today');if(epoch===planEpoch)planData=validatePlan(data)}catch(e){if(epoch===planEpoch)planError=e.message}finally{if(epoch===planEpoch){planLoading=false;if(page==='plan')render()}}}
function refreshPlan(){planData=null;loadPlan()}
function plan(){if(!planData&&!planLoading&&!planError)queueMicrotask(loadPlan);const d=planData;const today=new Date();const start=new Date(today);start.setDate(today.getDate()-((today.getDay()+6)%7));const days=Array.from({length:7},(_,i)=>{let day=new Date(start);day.setDate(start.getDate()+i);return `<div class="day ${day.toDateString()===today.toDateString()?'today':''}">${['M','T','W','T','F','S','S'][i]}<strong>${day.getDate()}</strong></div>`}).join('');return `<p class="eyebrow">MAKE ROOM TO REMEMBER</p><h1>Plan</h1><p class="sub">今天有方向，知識有回訪。</p><div class="days">${days}</div>${aPlanCard()}<div class="row between"><span class="tiny">${PLAN_CONFIG.mode==='demo'?'示例安排 · API 待接入':'依照你的最新學習紀錄'}</span><button class="link" onclick="refreshPlan()" ${planLoading||planBusy?'disabled':''}>Refresh ↻</button></div>${planLoading?'<div class="card"><p class="sub" role="status">正在整理今天的學習與複習…</p></div>':planError?`<div class="card"><h3>稍後再試一次</h3><p class="sub" role="alert">${escapeHTML(planError)}</p>${button('Retry','loadPlan()')}</div>`:!d?'':`<div class="card quiet"><div class="row between"><div><p class="eyebrow">TODAY'S RHYTHM</p><h2>${d.usedMinutes} / ${d.goalMinutes} min</h2></div><span class="badge">${d.items.filter(i=>i.status==='completed').length} / ${d.items.length} done</span></div><div class="progress"><i style="width:${Math.min(100,d.usedMinutes/d.goalMinutes*100)}%"></i></div><p class="tiny" style="margin-bottom:0">先回顧，再前進。完成項目後會更新今天的安排。</p></div><p class="eyebrow" style="margin-top:28px">01 / DUE FOR REVIEW</p><h2>Keep it familiar.</h2><p class="sub" style="margin-bottom:12px">今天到期的知識，花幾分鐘重新想一遍。</p>${d.items.filter(i=>i.type==='review').map(planItem).join('')||'<div class="card"><p class="sub">今天沒有到期複習。</p></div>'}<p class="eyebrow" style="margin-top:30px">02 / TODAY'S LEARNING</p><h2>One clear next step.</h2><p class="sub" style="margin-bottom:12px">依照目前地圖進度安排，保留闖關順序。</p>${d.items.filter(i=>i.type!=='review').map(planItem).join('')}<section style="margin-top:34px"><p class="eyebrow">03 / AI KNOWLEDGE INSIGHTS</p><h2>Understand your progress.</h2><p class="sub" style="margin-bottom:12px">不只看分數，也看哪些概念需要再確認。</p><div class="ai"><div class="row between">${icon('spark')}<span class="tiny">${PLAN_CONFIG.mode==='demo'?'示例分析':'已更新'}</span></div><h3 style="margin-top:15px">${escapeHTML(d.insights.summary||'正在整理學習線索')}</h3><p class="sub" style="margin:0">${escapeHTML(d.insights.note||'')}</p></div>${d.insights.knowledge.map(k=>`<div class="card" style="padding:16px"><div class="row between"><h3>${escapeHTML(k.label)}</h3><span class="badge" style="background:${k.status==='familiar'?'var(--mint)':k.status==='review'?'var(--sand)':'var(--lav)'}">${k.status==='familiar'?'較熟悉':k.status==='review'?'需複習':'待確認'}</span></div><p class="sub" style="margin:8px 0 0">${escapeHTML(k.evidence)}</p></div>`).join('')}<p class="footer-note">${PLAN_CONFIG.mode==='demo'?'目前為示例資料，尚未發送 API 請求。':'分析來自已完成的學習與複習紀錄。'}<br>資料不足時顯示「待確認」，避免把一次答對當作完全掌握。</p></section>`}`}
function planItem(item){const done=item.status==='completed';return `<button class="listbtn" data-plan-id="${escapeHTML(item.id)}" onclick="openPlanItem(this.dataset.planId)" ${done||planBusy?'disabled':''}><span class="letter">${icon(done?'check':item.type==='review'?'plan':item.type==='learn'?'cpu':'code')}</span><span class="label"><h3>${escapeHTML(item.title)}</h3><p>${escapeHTML(item.subtitle||'')} · ${item.minutes} min</p></span><span class="tiny">${done?'Done':item.type==='review'?'今日到期':'→'}</span></button>`}
let activeReview=null;
function openPlanItem(id){let item=planData?.items.find(i=>i.id===id);if(!item||item.status==='completed')return;if(item.type==='review'){activeReview=item;const q=id.includes('io')?['📷','A photo, taken.','拍照時，相機感光元件把影像交給電腦。它屬於什麼？',['輸入','輸出','永久儲存'],0]:['💻','A fresh workspace.','電腦關機後，哪一種資料通常不會保留？',['SSD 上的照片','RAM 中的暫存內容','硬碟上的功課'],1];modal(`<p class="eyebrow">A LITTLE RECALL · ${escapeHTML(item.title)}</p><div class="emoji">${q[0]}</div><h2>${q[1]}</h2><p class="sub">${q[2]}</p>${q[3].map((choice,index)=>button(choice,`submitReview(${index===q[4]})`,'choice')).join('')}`)}else if(item.route==='hardware')go('hardware');else if(item.route==='practice')go('practice');else toast('這個學習項目尚未提供預覽內容')}
async function submitReview(correct){if(!activeReview||planBusy)return;const item=activeReview;if(!correct){toast('再想一想這個概念。這次作答會作為複習線索。');if(PLAN_CONFIG.mode==='api'){try{await planRequest('/learning-events','POST',{eventId:crypto.randomUUID(),itemId:item.id,knowledgePointId:item.id.includes('io')?'io':'ram',kind:'review_attempt',correct:false,occurredAt:new Date().toISOString()})}catch(e){toast(e.message)}}return}planBusy=true;modal('<h2>正在更新複習紀錄…</h2><p class="sub" role="status">保存作答後，安排下一次回顧。</p>');try{let nextDate;if(PLAN_CONFIG.mode==='api'){const result=await planRequest('/reviews/'+encodeURIComponent(item.id)+'/complete','POST',{eventId:crypto.randomUUID(),correct:true,occurredAt:new Date().toISOString()});nextDate=result.nextReviewAt;planData=validatePlan(await planRequest('/plan/today'))}else{item.status='completed';planData.usedMinutes+=item.minutes;state.todayPlan=planData;save();nextDate=new Date(Date.now()+3*86400000).toISOString();}modal(`<p class="eyebrow">REVIEW COMPLETE</p><h2>Keep it with you.</h2><p class="sub">${item.id.includes('io')?'輸入装置把資料送入電腦。':'RAM 暫存正在使用的資料；長期保存則交給儲存裝置。'}<br><br>下次複習：${new Date(nextDate).toLocaleDateString('zh-HK')}${PLAN_CONFIG.mode==='demo'?'（示例間隔）':''}</p>${button('Back to today',"closeModal();go('plan')")}`)}catch(e){modal(`<h2>尚未保存</h2><p class="sub" role="alert">${escapeHTML(e.message)}</p>${button('回到安排',"closeModal();go('plan')")}`)}finally{planBusy=false;activeReview=null}}
async function recordPlanLearning(id,correct){if(!planData)return;const item=planData.items.find(i=>i.id===id);if(!item)return;if(PLAN_CONFIG.mode==='demo'){if(correct&&item.status!=='completed'){item.status='completed';planData.usedMinutes+=item.minutes;state.todayPlan=planData;save()}}else{try{await planRequest('/learning-events','POST',{eventId:crypto.randomUUID(),itemId:id,knowledgePointId:'ram',kind:id==='learn-ram'?'lesson_completed':'practice_attempt',correct,occurredAt:new Date().toISOString()});planData=validatePlan(await planRequest('/plan/today'))}catch(e){toast('學習紀錄尚未同步，請稍後重試。')}}}
function analysis(){const good=answerLog.filter((n,i)=>n===[0,1,0][i]).length;const focus=answerLog.length?(answerLog[0]!==0?'ram':answerLog[1]!==1?'ssd':answerLog[2]!==0?'cpu':'ram'):'ram';const labels={ram:['RAM','Memory · RAM','分清工作空間與永久儲存'],ssd:['SSD','Storage · SSD','了解關機後資料如何保留'],cpu:['CPU & graphics','Processing & graphics','探索處理指令與呈現畫面的分工']};return back('plan')+`<p class="eyebrow">YOUR LEARNING INSIGHTS</p><h1>A focused next step.</h1><p class="sub">${answerLog.length?'依照剛才的生活情境前測':'示例學習分析'} · 初步建議</p><div class="ai"><h3>${good===3?'A promising start.':'Start with '+labels[focus][0]+'.'}</h3><p class="sub" style="margin:0">${good===3?'三個生活情境都答得不錯。接下來透過互動探索確認你的理解。':'你的答案提供了一些學習線索；可以先探索以下部件，再用練習確認理解。'}</p></div><p class="eyebrow">YOUR STARTING POINT</p><div class="listbtn">${icon(focus)}<div><h3>${labels[focus][1]}</h3><p>${labels[focus][2]}</p></div></div>${button('Open the computer',"go('hardware')")}<p class="footer-note">此頁依前測答案提供規則式建議，尚未接入 AI 服務；前測不會跳過地圖節點。</p>`}
function settings(){return `<p class="eyebrow">MAKE IT YOURS</p><h1>Settings</h1><p class="sub">A calmer way to keep learning.</p><button class="listbtn" onclick="go('profile')"><span class="avatar">${icon('user')}</span><span class="label"><h3>${escapeHTML(state.name)}</h3><p>Lv. ${level()} · ${state.points.toLocaleString()} points</p></span><span>→</span></button><button class="listbtn" onclick="go('collection')"><span class="letter">${icon('collection')}</span><span class="label"><h3>Collection wall</h3><p>部件、徽章與成長紀念</p></span><span>→</span></button><div class="card"><p class="eyebrow">YOUR STUDY RHYTHM</p><div class="row setting"><label>Daily goal<small>Small steps count.</small></label><select aria-label="每日學習目標" onchange="toast('每日目標已更新')"><option>15 min</option><option>30 min</option><option>45 min</option></select></div><div class="row setting"><label>Learning reminders<small>在你設定的節奏繼續學習</small></label><button aria-label="切換學習提醒" aria-pressed="${state.reminder}" class="switch ${state.reminder?'':'off'}" onclick="state.reminder=!state.reminder;save();render()"></button></div><div class="row setting"><label>Language</label><span class="tiny">繁體中文 / English</span></div></div><div class="card"><p class="eyebrow">ACCOUNT</p><button class="link" onclick="modal('<h2>Privacy & data</h2><p class=\"sub\">本預覽僅在此瀏覽器儲存暱稱與示例進度，不會建立真實帳號或傳送資料。</p>')">Privacy & data →</button><br><button class="link" onclick="state.logged=false;save();render()">Sign out →</button></div><p class="footer-note">ICT companion · HTML preview v0.1</p>`}
function login(mode='welcome'){document.getElementById('nav').classList.add('hidden');return `<div class="login">${mode==='welcome'?`<p class="eyebrow" style="margin-top:50px">EXPLORE · UNDERSTAND · CREATE</p><h1>ICT, made clear.</h1><p class="sub">從生活出發。以自己的節奏學習。</p><div class="hero">${icon('cpu')}</div>${button('Sign up',"page='signup';render()")}${button('Already have an account? Sign in',"page='signin';render()",'link')}`:`${back('welcome')}<h1>${mode==='signup'?'Sign up':'Sign in'}</h1><p class="sub">Your learning journey continues.</p><form onsubmit="event.preventDefault();enterDemo(${mode==='signup'})">${mode==='signup'?'<label class="tiny" for="nickname">Nickname</label><input id="nickname" class="field" placeholder="Alex" maxlength="24" required>':''}<label class="tiny" for="email">Email</label><input id="email" class="field" type="email" placeholder="you@example.com" required><label class="tiny" for="password">Password</label><input id="password" class="field" type="password" placeholder="••••••••" minlength="6" required><button class="primary" type="submit" style="margin-top:22px">${mode==='signup'?'Create account':'Sign in'}${icon('arrow')}</button></form>${button(mode==='signup'?'Already registered? Sign in':'New here? Sign up',`page='${mode==='signup'?'signin':'signup'}';render()`,'link')}`}<p class="footer-note">本機示範登入，不會傳送帳號或密碼。</p>${button('Try as Alex · 試用現有學員',"enterDemo(false)",'link')}</div>`}function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function enterDemo(fresh){planEpoch++;planData=null;planLoading=false;planError='';state.logged=true;if(fresh){learnView=null;state.name=document.getElementById('nickname').value||'Alex';state.newUser=true;state.xp=0;state.points=0;state.done=[];state.featured=[];delete state.moduleA;delete state.todayPlan}save();go('home')}
function modal(html){clearTimeout(timer);document.getElementById('content').inert=true;document.getElementById('nav').inert=true;document.getElementById('overlay').innerHTML=`<div class="modal-shade"><section class="modal" role="dialog" aria-modal="true" aria-label="學習互動"><button class="close" onclick="closeModal()" aria-label="關閉">×</button>${html}</section></div>`;document.querySelector('.modal .close').focus()}function closeModal(){document.getElementById('content').inert=false;document.getElementById('nav').inert=false;clearTimeout(timer);document.getElementById('overlay').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const pretests=[['💻','Too many tabs.','開了十幾個分頁，電腦開始變慢。',["它需要更多工作空間","它需要更多儲存空間","螢幕不夠亮"]],['📷','A moment, saved.','照片關機後還在，誰替你保存？',["RAM","SSD／硬碟","滑鼠"]],['🎮','One more level.','遊戲裡的畫面，是誰幫忙畫出來？',["顯示卡","鍵盤","Wi-Fi"]]];
function startPretest(){answerLog=[];pretest(0)}function pretest(i){let q=pretests[i];modal(`<p class="eyebrow">A QUICK THOUGHT · ${i+1} / 3</p><h2>Before we explore</h2><p class="sub">No rush. Just your first instinct.</p><div class="emoji">${q[0]}</div><h2>${q[1]}</h2><p class="sub">${q[2]}</p><div id="choices"><p class="tiny">A moment to think…</p></div>`);timer=setTimeout(()=>{let c=document.getElementById('choices');if(c)c.innerHTML=q[3].map((s,n)=>`<button class="choice" onclick="choosePretest(${i},${n})"><span>${String.fromCharCode(65+n)} &nbsp; ${s}</span>→</button>`).join('')},1800)}function choosePretest(i,n){answerLog.push(n);if(i<2)pretest(i+1);else{closeModal();go('analysis')}}
function hardware(){return back()+`<p class="eyebrow">YOUR STARTING POINT</p><h1>Inside your computer</h1><p class="sub">點開部件，探索它如何運作。</p><div class="model"><div class="pc" id="pc"><div class="board"><button class="part cpu" onclick="openPart('cpu')" aria-label="探索 CPU">CPU</button><button class="part ram" onclick="openPart('ram')" aria-label="探索 RAM">RAM</button><button class="part ssd" onclick="openPart('ssd')" aria-label="探索 SSD">SSD</button></div></div><div class="model-tools"><button onclick="rotatePC()">↻ Rotate</button><button onclick="zoomPC()">＋ Zoom</button><button onclick="dataFlow()">↗ Data flow</button></div></div><div class="card"><p class="eyebrow">03 / MEMORY · RAM</p><h2>The workspace of your computer.</h2><p class="sub">像書桌一樣，RAM 暫時放著電腦正在使用的資料。</p>${button('Explore RAM',"openPart('ram')")}</div><p class="footer-note">可旋轉的 CSS 立體示意；正式版可換成完整 3D 模型。</p>`}let rotation=false,zoom=false;function rotatePC(){rotation=!rotation;document.getElementById('pc').style.transform=`rotateY(${rotation?28:-28}deg) rotateX(8deg) scale(${zoom?1.25:1})`}function zoomPC(){zoom=!zoom;document.getElementById('pc').style.transform=`rotateY(${rotation?28:-28}deg) rotateX(8deg) scale(${zoom?1.25:1})`}function dataFlow(){modal(`<p class="eyebrow">HOW DATA MOVES</p><h2>From a tap to a result.</h2><div class="card quiet">⌨️ Input → RAM → CPU → 🖥 Output</div><p class="sub">輸入裝置收集操作，資料進入記憶體，CPU 處理後交給輸出裝置。需要長期保留的資料則存入儲存裝置。</p>${button('Explore the parts',"closeModal()")}`)}let currentPart='ram';function openPart(p){currentPart=p;go('lesson')}
function lesson(){const data={cpu:['Processor · CPU','The brain at work.','你按下播放，CPU 就開始處理指令。它執行程式中的步驟，並協調電腦的運作。'],ram:['Memory · RAM','A little more workspace.','書桌越大，可以同時攤開更多課本。RAM 也是如此：暫時放著正在使用的程式與資料。關機後，這些內容不會一直保留。'],ssd:['Storage · SSD','Keep what matters.','相簿、功課和程式需要一個長期保存的地方。SSD 即使關機後仍能保留資料，與 RAM 的暫存工作空間不同。']}[currentPart];return back('hardware')+`<div class="lesson"><p class="eyebrow">${data[0]}</p><h1>${data[1]}</h1><div class="hero" style="text-align:center">${icon(currentPart)}</div><p>${data[2]}</p><div class="card quiet"><h3>Think about it.</h3><p>同時開啟很多程式時，你的電腦需要什麼？</p></div>${button('Try a quick check',"recordPlanLearning('learn-ram',true);go('practice')")}</div>`}
function practice(){return back('hardware')+`<p class="eyebrow">A QUICK CHECK</p><h1>A bigger desk.</h1><div class="emoji">🧑‍💻</div><p class="sub">同時開了視訊課、簡報和十幾個分頁。<br>哪一個部件提供暫時的工作空間？</p>${['CPU','RAM','SSD'].map((s,i)=>button(s,`practiceAnswer(${i})`,'choice')).join('')}`}function practiceAnswer(i){recordPlanLearning('check-ram',i===1);if(i!==1){toast('再想一下：誰會暫時放著正在使用的資料？');return}let first=!state.done.includes('ram');if(first){state.done.push('ram');state.xp+=120;state.points+=80;save()}modal(`<p class="eyebrow">WELL UNDERSTOOD</p><div class="emoji">✦</div><h2>Your collection is growing.</h2><p class="sub">RAM 提供暫時的工作空間，SSD 則長期保存資料。${first?'<br>+120 XP · +80 points · RAM collectible':'<br>你已領取過這個節點的獎勵。'}</p>${button('View collection',"closeModal();go('collection')")}${button('Continue on my map',"closeModal();go('home')",'link')}`)}
const jumpQs=[['連接家中網絡和互聯網的通常是哪個裝置？',['路由器','鍵盤','螢幕'],0],['同時處理多個程式時，哪個提供暫時工作空間？',['SSD','RAM','USB 線'],1],['圖書館要快速找出所有逾期書，哪個最適合？',['資料庫查詢','重畫封面','調高音量'],0],['程式不斷重複某一步，可能用了什麼？',['註解','迴圈','字型'],1],['收到陌生連結要求密碼，你會？',['直接填寫','轉發全班','先核實來源'],2]];let jumpIndex=0,jumpScore=0;function jumpPrompt(){pendingMap=state.map==='Computer systems'?'Internet & Applications':'Computer systems';modal(`<h2>Ready to jump ahead?</h2><p class="sub">跨章節先做 5 題準備度測驗，答對 4 題即可開啟新地圖。</p>${button('Start readiness check',"closeModal();startJump()")}`)}function startJump(){jumpIndex=0;jumpScore=0;jumpQuestion()}function jumpQuestion(){let q=jumpQs[jumpIndex];modal(`<p class="eyebrow">READINESS CHECK · ${jumpIndex+1} / 5</p><h2>Before you jump</h2><p class="sub">${q[0]}</p>${q[1].map((s,i)=>button(s,`jumpAnswer(${i})`,'choice')).join('')}`)}function jumpAnswer(i){if(i===jumpQs[jumpIndex][2])jumpScore++;jumpIndex++;if(jumpIndex<5)jumpQuestion();else{let passed=jumpScore>=4;modal(`<p class="eyebrow">READINESS RESULT</p><h2>${passed?'A new path is open.':'A little practice first.'}</h2><div class="card quiet" style="text-align:center;font-size:40px">${jumpScore} / 5</div><p class="sub">${passed?'已通過準備度測驗，可以進入新章節。':'先完成目前章節的剩餘節點，再試一次。'}</p>${button(passed?'Enter this chapter':'Back to my map',passed?"state.map=pendingMap.toLowerCase()==='computer systems'?'Computer systems':(pendingMap||'Internet & Applications');save();closeModal();go('home')":"closeModal();go('home')")}`)}}
function mission(type){modal(`<p class="eyebrow">MONTHLY CHALLENGE</p><h2>Campus, connected.</h2><p class="sub">圖書館連不上 Wi-Fi。找出問題，讓大家重新連線。</p><div class="card quiet">${icon('wifi')} &nbsp; 排查路由器 → 檢查訊號 → 驗證連線</div>${button('Solo challenge',"closeModal();wifiMission()")}${button('Invite a classmate',"closeModal();toast('組隊申請已呈現；此預覽不會向同學發送訊息')",'link')}<p class="footer-note">合作功能為流程示範，尚未連接班級名單。</p>`)}function wifiMission(){modal(`<p class="eyebrow">MISSION · DIAGNOSE</p><h2>No signal, no problem.</h2><p class="sub">所有裝置都連不上 Wi-Fi，路由器電源燈也沒亮。先檢查什麼？</p>${button('路由器電源',"completeWifi()",'choice')}${button('重新安裝所有程式',"toast('先從共同的網絡設備找線索')",'choice')}${button('更換每個人的螢幕',"toast('螢幕與 Wi-Fi 連線無關')",'choice')}`)}function completeWifi(){let first=!state.done.includes('wifi');if(first){state.done.push('wifi');state.points+=150;state.xp+=200;save()}modal(`<h2>Campus, connected.</h2><p class="sub">先確認電源，再逐步排查連線，是解決問題的好起點。${first?'<br>+200 XP · +150 points · Wi-Fi badge':'<br>你已領取這個任務的獎勵。'}</p>${button('Back to my map',"closeModal();go('home')")}`)}
function render({preserveScroll=false}={}){const content=document.getElementById('content'),scrollTop=preserveScroll?content.scrollTop:0;nav();const views={home,learn,plan,settings,profile,collection,framework,analysis,hardware,lesson,practice,moduleA:aModule,aTopic:aTopicView,aLesson:aLessonView,aResult,aReview,aDse:aDseView};content.innerHTML=state.logged?(views[page]||home)():login(['signin','signup'].includes(page)?page:'welcome');content.scrollTop=scrollTop}
</script><script src="module-a.js?v=20261010-check-layout"></script><script src="module-a-questions.js"></script><script src="module-a-training.js?v=20261010-learn-resume"></script><script>if(new URLSearchParams(location.search).get('preview')==='module-a'){state.logged=true;page='moduleA';}aEnsureTraining();render();aTrainingBoot();</script></body></html>
