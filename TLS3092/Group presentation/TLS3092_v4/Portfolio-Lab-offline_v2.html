om:8px}.tight pre{padding:7px;margin:7px 0}.tight .footer{margin-top:10px}}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cnav class=\"toolbar\" aria-label=\"工作紙工具\">\u003cbutton type=\"button\" onclick=\"window.print()\">打印／另存 PDF\u003c/button>\u003cspan>共四頁：HTML 兩頁、CSS 兩頁。第一課只派第 1–2 頁。\u003c/span>\u003c/nav>\n\u003csection class=\"sheet\">\n\u003ch1>Portfolio Lab · HTML 備用工作紙\u003c/h1>\u003cp class=\"sub\">Lesson 1 · 70 分鐘 · 第 1 / 4 頁\u003c/p>\n\u003cdiv class=\"identity\">\u003cspan>別名：______________\u003c/span>\u003cspan>班號：______\u003c/span>\u003cspan>日期：______________\u003c/span>\u003c/div>\n\u003ch2>1. 課前診斷（0–10 分鐘，連導入）\u003c/h2>\n\u003col class=\"qlines\">\u003cli>網頁的標題有甚麼用途？\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003cli>哪種功能可讓讀者按文字前往另一頁？\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003cli>使用照片或個人資料前，應先檢查甚麼？\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003c/ol>\n\u003ch2>2. 參考範例（10–20 分鐘）\u003c/h2>\n\u003cpre>&lt;!doctype html&gt;\n&lt;html lang=\"zh-HK\"&gt;\n&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Alex 的 Portfolio&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Alex 的 Portfolio&lt;/h1&gt;\n  &lt;p&gt;我喜歡攝影。&lt;/p&gt;\n  &lt;img src=\"mountain.svg\" alt=\"山脊與日出的練習插圖\"&gt;\n  &lt;a href=\"#projects\"&gt;看看我的作品&lt;/a&gt;\n  &lt;section id=\"projects\"&gt;&lt;h2&gt;我的作品&lt;/h2&gt;&lt;/section&gt;\n&lt;/body&gt;\n&lt;/html&gt;\u003c/pre>\n\u003cp>\u003ccode>head\u003c/code> 放文件資料；\u003ccode>body\u003c/code> 放顯示內容。\u003ccode>src\u003c/code> 是圖片來源，\u003ccode>alt\u003c/code> 是文字替代，\u003ccode>href\u003c/code> 是連結目的地。\u003ccode>img\u003c/code> 沒有結束標籤。\u003c/p>\n\u003ch2>3. 標籤配對（20–30 分鐘）\u003c/h2>\n\u003cp>在右欄填 A–D：A 圖片、B 超連結、C 段落、D 主標題。\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>標籤\u003c/th>\u003cth>功能\u003c/th>\u003cth>屬性／注意事項\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>&lt;h1&gt;\u003c/code>\u003c/td>\u003ctd>________\u003c/td>\u003ctd>表示頁面的主要主題\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>&lt;p&gt;\u003c/code>\u003c/td>\u003ctd>________\u003c/td>\u003ctd>相關的句子組成段落\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>&lt;img&gt;\u003c/code>\u003c/td>\u003ctd>________\u003c/td>\u003ctd>src、alt；內容圖片用具體描述\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>&lt;a&gt;\u003c/code>\u003c/td>\u003ctd>________\u003c/td>\u003ctd>href；連結文字說明目的地\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp class=\"footer\">可查閱參考，不必背碼。使用別名與授權素材；不要求真實照片、電話或住址。\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet tight\">\n\u003ch1>HTML · 除錯、設計與反思\u003c/h1>\u003cp class=\"sub\">Lesson 1 · 第 2 / 4 頁\u003c/p>\n\u003ch2>4. 修好這段源碼（30–45 分鐘）\u003c/h2>\n\u003cp>圈出兩個問題，再寫出修正。圖片是一張山景內容圖。\u003c/p>\n\u003cpre>&lt;h1&gt;My Portfolio\n&lt;p&gt;I enjoy photography.&lt;/p&gt;\n&lt;img src=\"mountain.svg\"&gt;\n&lt;a href=\"#projects\"&gt;My Projects&lt;/a&gt;\n&lt;section id=\"projects\"&gt;&lt;h2&gt;My Projects&lt;/h2&gt;&lt;/section&gt;\u003c/pre>\n\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n\u003ch2>5. 紙上 Portfolio（45–60 分鐘）\u003c/h2>\n\u003cp>先畫出內容位置，再寫 body 內的 HTML：主標題、介紹、含 alt 的圖片、可用連結和對應目的地。可用虛構角色。\u003c/p>\n\u003cdiv class=\"writing sketch\">\u003ch3>版面草圖\u003c/h3>\u003c/div>\n\u003cdiv class=\"writing draft\">\u003ch3>HTML 草稿\u003c/h3>\u003c/div>\n\u003ch2>6. 同伴檢查（60–66 分鐘）\u003c/h2>\n\u003cp>伙伴檢查：□ h1　□ p　□ 圖片 src／alt　□ href 與 id 相符　□ 標籤配對\u003c/p>\n\u003cp>我解釋了哪一項 HTML 選擇；伙伴指出的一個優點和一項具體建議：\u003c/p>\u003cdiv class=\"line\">\u003c/div>\n\u003ch2>7. 個人 Exit Ticket（66–70 分鐘）\u003c/h2>\n\u003col class=\"qlines\">\u003cli>解釋今天用過的兩個 HTML 元素的用途。\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003cli>\u003ccode>&lt;a&gt;My Projects&lt;/a&gt;\u003c/code> 欠了甚麼？寫出一個可用例子。\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003cli>今天修正了甚麼錯誤？你會怎樣在瀏覽器確認修正有效？下一課想改善甚麼？\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003c/ol>\n\u003cp class=\"footer\">設備恢復後：把草稿輸入瀏覽器，補測圖片、連結、顯示及保存。紙上檢查不能證明實際網頁正常。\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet recap-sheet\">\n\u003ch1>Portfolio Lab · CSS 備用工作紙\u003c/h1>\u003cp class=\"sub\">Lesson 2 · 70 分鐘 · 第 3 / 4 頁\u003c/p>\n\u003cdiv class=\"identity\">\u003cspan>別名：______________\u003c/span>\u003cspan>班號：______\u003c/span>\u003cspan>日期：______________\u003c/span>\u003c/div>\n\u003ch2>課前複習小測 · Lesson 1 HTML（0–5 分鐘）\u003c/h2>\n\u003cp>獨立圈出答案，檢查上一課的掌握；5–8 分鐘訂正後才開始 CSS。\u003c/p>\n\u003col class=\"recap-questions\">\n\u003cli>主標題和介紹段落分別用甚麼？\u003cbr>A \u003ccode>h1、p\u003c/code>　B \u003ccode>p、img\u003c/code>　C \u003ccode>img、a\u003c/code>\u003c/li>\n\u003cli>圖片的 src 和 alt 分別用來做甚麼？\u003cbr>A 描述、來源　B 來源、文字替代　C 兩者都指定連結目的地\u003c/li>\n\u003cli>目標已有 \u003ccode>id=\"projects\"\u003c/code>，連結的開始標籤應怎樣寫？\u003cbr>A \u003ccode>&lt;a src=\"#projects\"&gt;\u003c/code>　B \u003ccode>&lt;a href=\"projects\"&gt;\u003c/code>　C \u003ccode>&lt;a href=\"#projects\"&gt;\u003c/code>\u003c/li>\n\u003cli>\u003ccode>&lt;h1&gt;我的 Portfolio&lt;p&gt;我喜歡攝影。&lt;/p&gt;\u003c/code> 欠甚麼？\u003cbr>A 圖片後加 \u003ccode>&lt;/img&gt;\u003c/code>　B 標題後、p 前加 \u003ccode>&lt;/h1&gt;\u003c/code>　C 段落加 href\u003c/li>\n\u003c/ol>\n\u003ch2>1. 讀規則與觀察（8–20 分鐘）\u003c/h2>\n\u003cp>HTML 描述內容結構；CSS 控制呈現樣式。圈出下列規則的選擇器，為屬性畫底線，為值畫方框。\u003c/p>\n\u003cpre>h1 { color: #17634b; }\nbody { font-family: Arial, sans-serif; font-size: 18px;\n  line-height: 1.7; color: #243b35; background-color: #f4f8f6; }\u003c/pre>\n\u003cp>\u003ccode>h1\u003c/code> 選取 h1 元素；\u003ccode>.intro\u003c/code> 選取 class=\"intro\"；\u003ccode>#projects\u003c/code> 選取 id=\"projects\"。HTML 和 CSS 可以分開編輯，匯出時放入 head 內的 style 元素；多頁網站可共用外部 CSS。\u003c/p>\n\u003ch2>2. 預測與除錯（20–35 分鐘）\u003c/h2>\n\u003cp>相同條件、相同選擇器的規則，後面的宣告覆蓋前面的。以下段落最後是甚麼顏色？為甚麼？\u003c/p>\n\u003cpre>p { color: #333333; }\np { color: #17634b; }\u003c/pre>\u003cdiv class=\"line\">\u003c/div>\n\u003cp>修正下面的語法，使標題為指定綠色、字體大小為 28px。\u003c/p>\n\u003cpre>h1 {\n  color #17634b\n  font-size: 28px;\n}\u003c/pre>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n\u003ch2>3. 盒模型參考\u003c/h2>\n\u003cdiv class=\"box-model\">margin：外距\u003cdiv>border：邊框\u003cdiv>padding：內距\u003cdiv>content：內容\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>文字與邊框之間：________；邊框外的距離：________。\u003c/p>\n\u003cp class=\"footer\">先預測效果再測試；網頁可讀性包括文字大小、行距、對比和清楚連結，不只配色。\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet\">\n\u003ch1>CSS · 改善 Portfolio 閱讀體驗\u003c/h1>\u003cp class=\"sub\">Lesson 2 · 第 4 / 4 頁\u003c/p>\n\u003ch2>4. 設計樣式（35–55 分鐘）\u003c/h2>\n\u003cp>為第一課作品寫 CSS：正文的字型、大小、行高、文字與背景顏色；標題顏色；section 的 padding、margin-top、border；連結底線。可選有足夠對比的其他配色。\u003c/p>\n\u003cdiv class=\"writing large\">\u003ch3>我的 CSS\u003c/h3>\u003c/div>\n\u003ch2>5. 解釋與同伴回饋（55–65 分鐘）\u003c/h2>\n\u003cp>我改善的一項閱讀問題是甚麼？指出相關 CSS 規則，解釋原因。\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n\u003cp>同伴建議我怎樣改得更清楚？\u003c/p>\u003cdiv class=\"line\">\u003c/div>\n\u003ch2>6. 個人 Exit Ticket（65–70 分鐘）\u003c/h2>\n\u003cp>① 分辨 HTML 與 CSS 的工作。② 寫一條段落顏色規則，指出選擇器、屬性和值。③ 分辨 padding 與 margin，並說明你會怎樣測試改善。\u003c/p>\n\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n\u003ch2>設備恢復後要補做的檢查\u003c/h2>\n\u003cul class=\"checklist\">\n\u003cli>開啟 HTML，圖片顯示正常；點連結能到目的地。\u003c/li>\n\u003cli>把 CSS 輸入教材的 CSS 欄，比較有／無樣式。\u003c/li>\n\u003cli>確認實際字體、顏色、行距與留白，修正無效宣告。\u003c/li>\n\u003cli>用窄畫面及鍵盤 Tab 檢查；請同伴閱讀內容。\u003c/li>\n\u003cli>下載 JSON 備份與 HTML；獨立開啟 HTML 再測一次。\u003c/li>\n\u003c/ul>\n\u003cp class=\"footer\">紙本能顯示理解、預測和設計。實際呈現、可用連結與檔案匯出必須在設備恢復後驗證。\u003c/p>\n\u003c/section>\n\u003c/body>\u003c/html>\n","print/teacher-key.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-HK\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003clink rel=\"icon\" href=\"data:,\">\u003ctitle>Portfolio Lab · 教師答案與評閱準則\u003c/title>\u003cstyle>*{box-sizing:border-box}body{font-family:Arial,\"PingFang HK\",\"Micro margin:0;width:210mm;min-height:0;height:297mm;padding:12mm 15mm;break-after:page;overflow:visible}.sheet:last-child{break-after:auto}h1{font-size:18pt}h2{font-size:13pt;margin-top:14px}h3{font-size:11pt}pre{font-size:9pt;line-height:1.5;padding:9px}table{font-size:9.5pt}th,td{padding:6px}.writing.large{min-height:180px}.writing.medium{min-height:125px}.writing{min-height:110px}.line{height:24px}.footer{font-size:8.5pt}.identity{margin:10px 0}.columns{display:grid;grid-template-columns:1fr 1fr}}\n\n@media print{.box-model{padding:8px}.box-model>div{padding:8px}.box-model>div>div{padding:6px}pre{line-height:1.4}h2{margin-top:12px}}\n\n@media print{html[lang=en] body{font-size:10pt;line-height:1.42}html[lang=en] h1{font-size:17pt}html[lang=en] .sub{font-size:10pt}html[lang=en] .footer{font-size:8.5pt}html[lang=en] table{font-size:9.5pt}}\n\n@media print{.recap-sheet h2{margin-top:8px}.recap-sheet p{margin-bottom:10px}.recap-sheet pre{padding:6px;margin:7px 0}.recap-sheet .recap-questions li{margin-bottom:3px}.recap-sheet .line{height:18px}.recap-sheet .box-model,.recap-sheet .box-model>div,.recap-sheet .box-model>div>div{padding:4px}.recap-sheet .footer{margin-top:10px}}\n\n.qlines{padding-left:22px;margin:6px 0 4px}.qlines li{margin-bottom:4px}.qlines .line{height:25px}.writing.sketch{min-height:95px}.writing.draft{min-height:205px}@media print{.qlines .line{height:21px}.qlines li{margin-bottom:2px}.writing.sketch{min-height:72px}.writing.draft{min-height:160px}.tight h2{margin-top:9px}.tight p{margin-bottom:8px}.tight pre{padding:7px;margin:7px 0}.tight .footer{margin-top:10px}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cnav class=\"toolbar\">\u003cbutton type=\"button\" onclick=\"window.print()\">打印／另存 PDF\u003c/button>\u003cspan>形成性評估用；此頁可公開查閱。\u003c/span>\u003c/nav>\n\u003csection class=\"sheet\">\n\u003ch1>教師答案 · Lesson 1 HTML\u003c/h1>\u003cp class=\"sub\">第 1 / 2 頁 · 答案可接受合理的其他表述。\u003c/p>\n\u003ch2>診斷與標籤配對\u003c/h2>\n\u003col>\u003cli>標題說明頁面或內容區的主題，幫助讀者理解結構。\u003c/li>\u003cli>超連結。\u003c/li>\u003cli>相片使用權、同意、版權或私隱；不用真名或真實照片也可完成。\u003c/li>\u003c/ol>\n\u003cp>這些答案只留在學生的螢幕或紙上。教師巡視時閱讀，並請全班舉手，包括「記得必修部分哪些 HTML 標籤？」，按結果調整示範重點。\u003c/p>\n\u003cp>配對：h1 → D 主標題；p → C 段落；img → A 圖片；a → B 超連結。\u003c/p>\n\u003ch2>除錯參考\u003c/h2>\n\u003cpre>&lt;h1&gt;My Portfolio&lt;/h1&gt;\n&lt;p&gt;I enjoy photography.&lt;/p&gt;\n&lt;img src=\"mountain.svg\" alt=\"山脊與日出的練習插圖\"&gt;\n&lt;a href=\"#projects\"&gt;My Projects&lt;/a&gt;\n&lt;section id=\"projects\"&gt;&lt;h2&gt;My Projects&lt;/h2&gt;&lt;/section&gt;\u003c/pre>\n\u003cp>兩個目標問題：缺少 &lt;/h1&gt;；內容圖片欠 alt。其他具體而合適的描述亦可接受。裝飾圖片可用空 alt，但本題圖片被指定為內容圖。\u003c/p>\n\u003ch2>課後選做 HTML 自測\u003c/h2>\n\u003cp>完成 HTML 活動後才作答：1 h1；2 href；3 修正路徑再檢查 alt；4 別名、興趣與獲准素材。\u003c/p>\n\u003ch2>Exit Ticket 參考及評閱\u003c/h2>\n\u003cp>學生下載學習紀錄，連同匯出的 HTML 按學校慣常方式提交；教師在第二課前閱讀。\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>題目\u003c/th>\u003cth>達成證據\u003c/th>\u003cth>跟進\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>解釋兩元素\u003c/td>\u003ctd>例如 h1 標示主題、p 組織介紹、img 加圖片、a 建立連結。每個解釋合理。\u003c/td>\u003ctd>把「字較大」引回主題和結構用途。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>修復 a\u003c/td>\u003ctd>補 href，例：&lt;a href=\"#projects\"&gt;My Projects&lt;/a&gt;，另有 id=\"projects\" 目標。\u003c/td>\u003ctd>用 src/href 對比再試一次。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>除錯與轉移\u003c/td>\u003ctd>指出一項真實錯誤、修正及預覽／點測方式；提出 CSS 課的閱讀改進（時間不足時，最後一部分可改為課後任務）。\u003c/td>\u003ctd>只有「改好了」則請具體示範。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>Portfolio 草稿簡要規準\u003c/h2>\n\u003cp>分別記錄「已達成／需修正」：清楚主標題和介紹、可載入圖片、合適 alt、有用連結、源碼基本結構、可獨立開啟的匯出檔、合適素材、能解釋選擇。開放題及內容品質由教師判斷，不以自動檢查數目作總分。\u003c/p>\n\u003cp class=\"footer\">口頭問答須涵蓋四個元素，確認學生能解釋至少三個。範本完成不等同獨立理解。紙本課後補做瀏覽器驗證。\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet\">\n\u003ch1>教師答案 · Lesson 2 CSS\u003c/h1>\u003cp class=\"sub\">第 2 / 2 頁\u003c/p>\n\u003ch2>課前複習小測 · Lesson 1 HTML\u003c/h2>\n\u003cp>答案：1 A（h1／p）；2 B（src 是來源、alt 是文字替代）；3 C（href=\"#projects\" 配對 id）；4 B（標題後、p 前補 &lt;/h1&gt;）。這是第一課的複習，不考 CSS。首五分鐘獨立作答，5–8 分鐘按錯題重溫及補測草稿。\u003c/p>\n\u003ch2>規則、預測與除錯\u003c/h2>\n\u003cp>h1 是選擇器；color 是屬性；#17634b 是值。段落最終為 #17634b，因同條件及同選擇器後出的宣告覆蓋前者。修正：color 後加入冒號，色碼後加入分號。\u003c/p>\n\u003cpre>h1 { color: #17634b; font-size: 28px; }\nsection { padding: 20px; margin-top: 24px;\n  border: 1px solid #c7d6ce; }\u003c/pre>\n\u003cp>文字至邊框的內側為 padding；邊框外為 margin。CSS 有效值及完整宣告要在瀏覽器測試。\u003c/p>\n\u003ch2>CSS 課後自測（選做）\u003c/h2>\n\u003cp>只在完成 CSS 活動後選做：1 選擇器；2 padding；3 後出現的一條（來源、重要性、層和優先度相同時）；4 足夠對比、行距、底線。\u003c/p>\n\u003ch2>Exit Ticket 參考及評閱\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>題目\u003c/th>\u003cth>達成證據\u003c/th>\u003cth>跟進\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>HTML 與 CSS\u003c/td>\u003ctd>HTML 描述內容結構；CSS 控制外觀呈現。同一份 HTML 可套用不同樣式。\u003c/td>\u003ctd>切換 CSS，確認文字仍存在。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>段落顏色\u003c/td>\u003ctd>例：p { color: #243b35; }。正確指出 p / color / #243b35。\u003c/td>\u003ctd>分別改一個屬性及值，說明效果。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>盒模型與測試\u003c/td>\u003ctd>分辨內距與外距；提出具體改善，並以預覽、窄畫面或同伴閱讀驗證。\u003c/td>\u003ctd>讓學生在紙本框圖標示位置，再到瀏覽器改動。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>觀察而非單靠數字\u003c/h2>\n\u003cp>網站抽樣檢查 body 及 h1 文字對比、字體大小、行高、section 盒模型及底線。它沒有評估所有背景、巢狀區域或內容含義。需另做鍵盤、窄畫面及實際閱讀測試。\u003c/p>\n\u003ch2>調整教學的決定\u003c/h2>\n\u003cp>若學生能套用範本但解釋不清，下一課先讀一條新規則並預測效果。若多名學生混淆 padding／margin，用框圖再示範。若主要卡在檔案操作，先練備份與重新匯入，讓學生能保存成果。\u003c/p>\n\u003cp class=\"footer\">備案：紙本可評估概念和設計；瀏覽器執行、圖片／連結及匯出功能必須在設備恢復後補測。\u003c/p>\n\u003c/section>\u003c/body>\u003c/html>\n","print/worksheet.en.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"referrer\" content=\"no-referrer\">\u003clink rel=\"icon\" href=\"data:,\">\u003ctitle>Portfolio Lab · Student backup worksheets\u003c/title>\u003cstyle>*{box-sizing:border-box}body{font-family:Arial,\"PingFang HK\",\"Microsoft JhengHei\",sans-serif;color:#111;background:#e9eceb;margin m;break-after:page;overflow:visible}.sheet:last-child{break-after:auto}h1{font-size:18pt}h2{font-size:13pt;margin-top:14px}h3{font-size:11pt}pre{font-size:9pt;line-height:1.5;padding:9px}table{font-size:9.5pt}th,td{padding:6px}.writing.large{min-height:180px}.writing.medium{min-height:125px}.writing{min-height:110px}.line{height:24px}.footer{font-size:8.5pt}.identity{margin:10px 0}.columns{display:grid;grid-template-columns:1fr 1fr}}\n\n@media print{.box-model{padding:8px}.box-model>div{padding:8px}.box-model>div>div{padding:6px}pre{line-height:1.4}h2{margin-top:12px}}\n\n@media print{html[lang=en] body{font-size:10pt;line-height:1.42}html[lang=en] h1{font-size:17pt}html[lang=en] .sub{font-size:10pt}html[lang=en] .footer{font-size:8.5pt}html[lang=en] table{font-size:9.5pt}}\n\n@media print{.recap-sheet h2{margin-top:8px}.recap-sheet p{margin-bottom:10px}.recap-sheet pre{padding:6px;margin:7px 0}.recap-sheet .recap-questions li{margin-bottom:3px}.recap-sheet .line{height:18px}.recap-sheet .box-model,.recap-sheet .box-model>div,.recap-sheet .box-model>div>div{padding:4px}.recap-sheet .footer{margin-top:10px}}\n\n.qlines{padding-left:22px;margin:6px 0 4px}.qlines li{margin-bottom:4px}.qlines .line{height:25px}.writing.sketch{min-height:95px}.writing.draft{min-height:205px}@media print{.qlines .line{height:21px}.qlines li{margin-bottom:2px}.writing.sketch{min-height:72px}.writing.draft{min-height:160px}.tight h2{margin-top:9px}.tight p{margin-bottom:8px}.tight pre{padding:7px;margin:7px 0}.tight .footer{margin-top:10px}}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cnav class=\"toolbar\" aria-label=\"Worksheet tools\">\u003cbutton type=\"button\" onclick=\"window.print()\">Print / Save as PDF\u003c/button>\u003cspan>Four pages: two for HTML, two for CSS. Use pages 1–2 for Lesson 1.\u003c/span>\u003c/nav>\n\u003csection class=\"sheet\">\n\u003ch1>Portfolio Lab · HTML backup worksheet\u003c/h1>\u003cp class=\"sub\">Lesson 1 · 70 minutes · Page 1 / 4\u003c/p>\n\u003cdiv class=\"identity\">\u003cspan>Alias: ______________\u003c/span>\u003cspan>Class no.: ______\u003c/span>\u003cspan>Date: ______________\u003c/span>\u003c/div>\n\u003ch2>1. Diagnostic questions (0–10 minutes, including introduction)\u003c/h2>\n\u003col class=\"qlines\">\u003cli>What is the purpose of a heading on a web page?\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003cli>What feature lets a reader click text to open another page?\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003cli>What should you check before using a photo or personal information?\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003c/ol>\n\u003ch2>2. Reference example (10–20 minutes)\u003c/h2>\n\u003cpre>&lt;!doctype html&gt;\n&lt;html lang=\"en\"&gt;\n&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Alex's Portfolio&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Alex's Portfolio&lt;/h1&gt;\n  &lt;p&gt;I enjoy photography.&lt;/p&gt;\n  &lt;img src=\"mountain.svg\" alt=\"Mountain ridges and sunrise\"&gt;\n  &lt;a href=\"#projects\"&gt;View my projects&lt;/a&gt;\n  &lt;section id=\"projects\"&gt;&lt;h2&gt;My projects&lt;/h2&gt;&lt;/section&gt;\n&lt;/body&gt;\n&lt;/html&gt;\u003c/pre>\n\u003cp>\u003ccode>head\u003c/code> holds document information; \u003ccode>body\u003c/code> holds displayed content. \u003ccode>src\u003c/code> is the image source, \u003ccode>alt\u003c/code> is a text alternative, and \u003ccode>href\u003c/code> is a link destination. \u003ccode>img\u003c/code> has no end tag.\u003c/p>\n\u003ch2>3. Match the tags (20–30 minutes)\u003c/h2>\n\u003cp>Write A–D: A image, B hyperlink, C paragraph, D main heading.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Tag\u003c/th>\u003cth>Purpose\u003c/th>\u003cth>Attribute / reminder\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>&lt;h1&gt;\u003c/code>\u003c/td>\u003ctd>________\u003c/td>\u003ctd>Identifies the page's main topic\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>&lt;p&gt;\u003c/code>\u003c/td>\u003ctd>________\u003c/td>\u003ctd>Groups related sentences\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>&lt;img&gt;\u003c/code>\u003c/td>\u003ctd>________\u003c/td>\u003ctd>src and alt; describe a content image meaningfully\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>&lt;a&gt;\u003c/code>\u003c/td>\u003ctd>________\u003c/td>\u003ctd>href; link text explains the destination\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp class=\"footer\">Use the reference; memorising code is not required. Use an alias and permitted images. Real photos, phone numbers and home addresses are not required.\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet tight\">\n\u003ch1>HTML · Debug, design and reflect\u003c/h1>\u003cp class=\"sub\">Lesson 1 · Page 2 / 4\u003c/p>\n\u003ch2>4. Repair this source (30–45 minutes)\u003c/h2>\n\u003cp>Circle two problems and write the corrections. The mountain picture is a content image.\u003c/p>\n\u003cpre>&lt;h1&gt;My Portfolio\n&lt;p&gt;I enjoy photography.&lt;/p&gt;\n&lt;img src=\"mountain.svg\"&gt;\n&lt;a href=\"#projects\"&gt;My Projects&lt;/a&gt;\n&lt;section id=\"projects\"&gt;&lt;h2&gt;My Projects&lt;/h2&gt;&lt;/section&gt;\u003c/pre>\n\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n\u003ch2>5. Paper portfolio (45–60 minutes)\u003c/h2>\n\u003cp>Sketch the layout, then write the HTML inside body: a main heading, introduction, image with alt, and a link with a matching target. You may use a fictional character.\u003c/p>\n\u003cdiv class=\"writing sketch\">\u003ch3>Layout sketch\u003c/h3>\u003c/div>\n\u003cdiv class=\"writing draft\">\u003ch3>HTML draft\u003c/h3>\u003c/div>\n\u003ch2>6. Peer review (60–66 minutes)\u003c/h2>\n\u003cp>My partner checks: □ h1　□ p　□ image src / alt　□ matching href / id　□ paired tags\u003c/p>\n\u003cp>The HTML choice I explained, and one strength and one specific suggestion from my partner:\u003c/p>\u003cdiv class=\"line\">\u003c/div>\n\u003ch2>7. Individual Exit Ticket (66–70 minutes)\u003c/h2>\n\u003col class=\"qlines\">\u003cli>Explain the purposes of two HTML elements you used today.\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003cli>What is missing from \u003ccode>&lt;a&gt;My Projects&lt;/a&gt;\u003c/code>? Write a working example.\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003cli>What error did you fix today, and how would you test the fix in a browser? What would you like to improve next lesson?\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/li>\u003c/ol>\n\u003cp class=\"footer\">When devices recover, enter your draft and test display, images, links and saving in a browser. Paper checks do not prove that a web page works.\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet recap-sheet\">\n\u003ch1>Portfolio Lab · CSS backup worksheet\u003c/h1>\u003cp class=\"sub\">Lesson 2 · 70 minutes · Page 3 / 4\u003c/p>\n\u003cdiv class=\"identity\">\u003cspan>Alias: ______________\u003c/span>\u003cspan>Class no.: ______\u003c/span>\u003cspan>Date: ______________\u003c/span>\u003c/div>\n\u003ch2>Before class · Lesson 1 HTML recap (0–5 minutes)\u003c/h2>\n\u003cp>Circle answers independently. Review them at minutes 5–8 before starting CSS.\u003c/p>\n\u003col class=\"recap-questions\">\n\u003cli>Which elements give a main heading and introductory paragraph?\u003cbr>A \u003ccode>h1, p\u003c/code>　B \u003ccode>p, img\u003c/code>　C \u003ccode>img, a\u003c/code>\u003c/li>\n\u003cli>What are the jobs of an image's src and alt, respectively?\u003cbr>A Description, source　B Source, text alternative　C Both give a link destination\u003c/li>\n\u003cli>The target has \u003ccode>id=\"projects\"\u003c/code>. Which start tag gives the correct same-page destination?\u003cbr>A \u003ccode>&lt;a src=\"#projects\"&gt;\u003c/code>　B \u003ccode>&lt;a href=\"projects\"&gt;\u003c/code>　C \u003ccode>&lt;a href=\"#projects\"&gt;\u003c/code>\u003c/li>\n\u003cli>What is missing from \u003ccode>&lt;h1&gt;My Portfolio&lt;p&gt;I enjoy photography.&lt;/p&gt;\u003c/code>?\u003cbr>A Add \u003ccode>&lt;/img&gt;\u003c/code>　B Add \u003ccode>&lt;/h1&gt;\u003c/code> before p　C Add href to p\u003c/li>\n\u003c/ol>\n\u003ch2>1. Read rules and observe (8–20 minutes)\u003c/h2>\n\u003cp>HTML gives structure; CSS gives presentation. Circle selectors, underline properties and box values.\u003c/p>\n\u003cpre>h1 { color: #17634b; }\nbody { font-family: Arial, sans-serif; font-size: 18px;\n  line-height: 1.7; color: #243b35; background-color: #f4f8f6; }\u003c/pre>\n\u003cp>\u003ccode>h1\u003c/code> selects h1 elements; \u003ccode>.intro\u003c/code> selects class=\"intro\"; \u003ccode>#projects\u003c/code> selects id=\"projects\". Edit HTML and CSS separately. Export places CSS in a style element inside head; several pages can share an external stylesheet.\u003c/p>\n\u003ch2>2. Predict and debug (20–35 minutes)\u003c/h2>\n\u003cp>The rules have the same selector and equal priority. What colour wins, and why?\u003c/p>\n\u003cpre>p { color: #333333; }\np { color: #17634b; }\u003c/pre>\u003cdiv class=\"line\">\u003c/div>\n\u003cp>Fix the syntax below to make the heading green with a font size of 28px.\u003c/p>\n\u003cpre>h1 {\n  color #17634b\n  font-size: 28px;\n}\u003c/pre>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n\u003ch2>3. Box-model reference\u003c/h2>\n\u003cdiv class=\"box-model\">margin: outside the border\u003cdiv>border\u003cdiv>padding: inside the border\u003cdiv>content\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>Space between text and border: __________; space outside the border: __________.\u003c/p>\n\u003cp class=\"footer\">Predict, then test. Readability includes text size, line spacing, contrast and clear links, as well as colour choices.\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet\">\n\u003ch1>CSS · Make your portfolio easier to read\u003c/h1>\u003cp class=\"sub\">Lesson 2 · Page 4 / 4\u003c/p>\n\u003ch2>4. Design your styles (35–55 minutes)\u003c/h2>\n\u003cp>Write CSS for your Lesson 1 work: body typeface, size, line height, text and background colour; heading colour; section padding, margin-top and border; underlined links. You may choose another palette with sufficient contrast.\u003c/p>\n\u003cdiv class=\"writing large\">\u003ch3>My CSS\u003c/h3>\u003c/div>\n\u003ch2>5. Explain and review (55–65 minutes)\u003c/h2>\n\u003cp>What reading problem did you improve? Identify the relevant CSS rule and explain your choice.\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n\u003cp>What specific change did your partner suggest?\u003c/p>\u003cdiv class=\"line\">\u003c/div>\n\u003ch2>6. Individual Exit Ticket (65–70 minutes)\u003c/h2>\n\u003cp>1. Distinguish HTML from CSS. 2. Write a paragraph colour rule and identify its selector, property and value. 3. Distinguish padding from margin and explain how you would test your improvement.\u003c/p>\n\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\n\u003ch2>Complete these tests when devices recover\u003c/h2>\n\u003cul class=\"checklist\">\n\u003cli>Open the HTML. Check the image and click the link to reach its destination.\u003c/li>\n\u003cli>Enter CSS in the CSS editor and compare styles on/off.\u003c/li>\n\u003cli>Check actual fonts, colours, line spacing and box spacing. Correct invalid declarations.\u003c/li>\n\u003cli>Try a narrow view and Tab navigation. Ask a partner to read the content.\u003c/li>\n\u003cli>Download JSON and HTML. Open the exported HTML independently and retest.\u003c/li>\n\u003c/ul>\n\u003cp class=\"footer\">Paper work shows understanding, prediction and design. Test actual display, usable links and file exports when devices recover.\u003c/p>\n\u003c/section>\n\u003c/body>\u003c/html>\n","print/teacher-key.en.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"referrer\" content=\"no-referrer\">\u003clink rel=\"icon\" href=\"data:,\">\u003ctitle>Portfolio Lab · Teacher answers and assessment guidance\u003c/title>\u003cstyle>*{box-sizing:border-box}body{font-family:Arial,\"PingFang HK\",\"Microsoft JhengHei\",sans-serif;color:#111;background:#e9eceb;margin:0;font-size:15px;line-height:1.55}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px;margin:18px 0 8px}h3{font-size:16px;margin:12px 0 5px}p{margin:6px 0 12px}.toolbar{padding:16px 24px;background:#fff;display:flex;gap:20px;align-items:center;border-bottom:1px solid #999}.toolbar button{padding:9px 18px;background:#fff;border:1px solid #444;border-radius:4px;font:inherit;cursor:pointer}.toolbar a{color:#111}.sheet{width:210mm;min-height:287mm;padding:15mm 16mm;margin:20px auto;background:white}.sub{font-size:14px}.identity{display:flex;gap:30px;border:1px solid #333;padding:8px 12px;margin:15px 0}.line{height:27px;border-bottom:1px solid #999}.writing{border:1px solid #555;padding:9px 12px;margin:10px 0;min-height:125px}.writing.large{min-height:220px}.writing.medium{min-height:170px}.writing h3{margin:0 0 6px}pre{font-family:Consolas,Menlo,monospace;white-space:pre-wrap;font-size:13px;line-height:1.6;border:1px solid #444;padding:12px;margin:10px 0}code{font-family:Consolas,Menlo,monospace}table{width:100%;border-collapse:collapse;font-size:14px;margin:9px 0}th,td{border:1px solid #444;text-align:left;padding:8px;vertical-align:top}th{font-weight:bold}ul,ol{padding-left:23px;margin:8px 0}li{margin-bottom:6px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.footer{margin-top:17px;font-size:12px}.checklist{list-style:none;padding:0}.checklist li:before{content:\"□ \";font-size:17px}.box-model{border:1px dashed #444;padding:12px;text-align:center}.box-model>div{border:3px solid #333;padding:15px}.box-model>div>div{border:1px solid #555;padding:10px}.answer{border-left:2px solid #555;padding-left:12px;margin:10px 0}summary{font-weight:bold}@media(max-width:820px){.sheet{width:auto;min-height:0;margin:12px;padding:24px}.columns{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}}@media print{@page{size:A4;margin:0}body{background:#fff;font-size:10pt;line-height:1.42}.toolbar{display:none}.sheet{margin:0;width:210mm;min-height:0;height:297mm;padding:12mm 15mm;break-after:page;overflow:visible}.sheet:last-child{break-after:auto}h1{font-size:18pt}h2{font-size:13pt;margin-top:14px}h3{font-size:11pt}pre{font-size:9pt;line-height:1.5;padding:9px}table{font-size:9.5pt}th,td{padding:6px}.writing.large{min-height:180px}.writing.medium{min-height:125px}.writing{min-height:110px}.line{height:24px}.footer{font-size:8.5pt}.identity{margin:10px 0}.columns{display:grid;grid-template-columns:1fr 1fr}}\n\n@media print{.box-model{padding:8px}.box-model>div{padding:8px}.box-model>div>div{padding:6px}pre{line-height:1.4}h2{margin-top:12px}}\n\n@media print{html[lang=en] body{font-size:10pt;line-height:1.42}html[lang=en] h1{font-size:17pt}html[lang=en] .sub{font-size:10pt}html[lang=en] .footer{font-size:8.5pt}html[lang=en] table{font-size:9.5pt}}\n\n@media print{.recap-sheet h2{margin-top:8px}.recap-sheet p{margin-bottom:10px}.recap-sheet pre{padding:6px;margin:7px 0}.recap-sheet .recap-questions li{margin-bottom:3px}.recap-sheet .line{height:18px}.recap-sheet .box-model,.recap-sheet .box-model>div,.recap-sheet .box-model>div>div{padding:4px}.recap-sheet .footer{margin-top:10px}}\n\n.qlines{padding-left:22px;margin:6px 0 4px}.qlines li{margin-bottom:4px}.qlines .line{height:25px}.writing.sketch{min-height:95px}.writing.draft{min-height:205px}@media print{.qlines .line{height:21px}.qlines li{margin-bottom:2px}.writing.sketch{min-height:72px}.writing.draft{min-height:160px}.tight h2{margin-top:9px}.tight p{margin-bottom:8px}.tight pre{padding:7px;margin:7px 0}.tight .footer{margin-top:10px}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cnav class=\"toolbar\" aria-label=\"Teacher answer tools\">\u003cbutton type=\"button\" onclick=\"window.print()\">Print / Save as PDF\u003c/button>\u003cspan>For formative assessment. Students can access this page.\u003c/span>\u003c/nav>\n\u003csection class=\"sheet\">\n\u003ch1>Teacher answers · Lesson 1 HTML\u003c/h1>\u003cp class=\"sub\">Page 1 / 2 · Accept other reasonable explanations.\u003c/p>\n\u003ch2>Diagnostic questions and tag matching\u003c/h2>\n\u003col>\u003cli>A heading identifies the topic of a page or section and helps readers understand its structure.\u003c/li>\u003cli>A hyperlink.\u003c/li>\u003cli>Image rights, permission, copyright or privacy. Students can use an alias and a fictional profile.\u003c/li>\u003c/ol>\n\u003cp>These answers stay on each student's screen or paper. Read them while circulating and take a show of hands, including \"Which HTML tags do you remember from the Compulsory Part?\" Use the result to adjust the demonstration.\u003c/p>\n\u003cp>Matching: h1 → D main heading; p → C paragraph; img → A image; a → B hyperlink.\u003c/p>\n\u003ch2>Debugging example\u003c/h2>\n\u003cpre>&lt;h1&gt;My Portfolio&lt;/h1&gt;\n&lt;p&gt;I enjoy photography.&lt;/p&gt;\n&lt;img src=\"mountain.svg\" alt=\"Mountain ridges and sunrise\"&gt;\n&lt;a href=\"#projects\"&gt;My Projects&lt;/a&gt;\n&lt;section id=\"projects\"&gt;&lt;h2&gt;My Projects&lt;/h2&gt;&lt;/section&gt;\u003c/pre>\n\u003cp>The target problems are a missing &lt;/h1&gt; and missing alt for a content image. Accept other specific, appropriate descriptions. A decorative image may use empty alt, but this task explicitly uses a content image.\u003c/p>\n\u003ch2>Optional HTML self-check after class\u003c/h2>\n\u003cp>Only after the HTML activities: 1. h1. 2. href. 3. Correct the path, then check alt. 4. An alias, interests and permitted materials.\u003c/p>\n\u003ch2>Exit Ticket guidance\u003c/h2>\n\u003cp>Students download the learning record and submit it with the exported HTML through the school's usual channel. Read these before Lesson 2.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Prompt\u003c/th>\u003cth>Evidence of achievement\u003c/th>\u003cth>Follow-up\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Explain two elements\u003c/td>\u003ctd>For example: h1 identifies the main topic; p groups an introduction; img embeds an image; a creates a link. Each explanation is reasonable.\u003c/td>\u003ctd>Move beyond \"larger text\" to topic and structure.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Repair a\u003c/td>\u003ctd>Add href, for example &lt;a href=\"#projects\"&gt;My Projects&lt;/a&gt;, with an id=\"projects\" target.\u003c/td>\u003ctd>Compare src and href, then retry.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Debug and transfer\u003c/td>\u003ctd>Identify an actual error, its fix and a preview or click test. Propose a readability improvement for CSS (this last part may become the post-lesson task if time is short).\u003c/td>\u003ctd>If the answer is only \"fixed it\", request a specific demonstration.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>Portfolio draft criteria\u003c/h2>\n\u003cp>Record \"achieved / needs revision\" for: a clear heading and introduction, a loaded image, appropriate alt, a useful link, basic source structure, an independently opened export, suitable materials and an explained choice. The teacher judges open responses and content quality. Do not turn the automatic check count into a final grade.\u003c/p>\n\u003cp class=\"footer\">Use oral questions covering all four elements to check that students can explain at least three. Completing a template does not prove independent understanding. Follow paper work with browser testing.\u003c/p>\n\u003c/section>\n\u003csection class=\"sheet\">\n\u003ch1>Teacher answers · Lesson 2 CSS\u003c/h1>\u003cp class=\"sub\">Page 2 / 2\u003c/p>\n\u003ch2>Before class · Lesson 1 HTML recap\u003c/h2>\n\u003cp>Answers: 1 A (h1/p); 2 B (src gives the source, alt a text alternative); 3 C (href=\"#projects\" matches the id); 4 B (close h1 before p). This reviews Lesson 1, not CSS. Answer independently for five minutes, then review errors and test the draft at minutes 5–8.\u003c/p>\n\u003ch2>Rules, prediction and debugging\u003c/h2>\n\u003cp>h1 is the selector; color is the property; #17634b is the value. The final paragraph colour is #17634b because, under equal conditions with the same selector, the later declaration wins. Add a colon after color and a semicolon after the colour code.\u003c/p>\n\u003cpre>h1 { color: #17634b; font-size: 28px; }\nsection { padding: 20px; margin-top: 24px;\n  border: 1px solid #c7d6ce; }\u003c/pre>\n\u003cp>padding is the space inside the border; margin is the space outside it. Check CSS values and complete declarations in a browser.\u003c/p>\n\u003ch2>Optional CSS self-check after class\u003c/h2>\n\u003cp>Only after the CSS activities: 1. Selector. 2. padding. 3. The later rule when origin, importance, layer and specificity are equal. 4. Sufficient contrast, line spacing and underlines.\u003c/p>\n\u003ch2>Exit Ticket guidance\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Prompt\u003c/th>\u003cth>Evidence of achievement\u003c/th>\u003cth>Follow-up\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>HTML and CSS\u003c/td>\u003ctd>HTML describes content structure; CSS controls presentation. The same HTML can receive different styles.\u003c/td>\u003ctd>Toggle CSS and check that the content remains.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Paragraph colour\u003c/td>\u003ctd>For example, p { color: #243b35; }. Correctly identify p, color and #243b35.\u003c/td>\u003ctd>Change a property or value and explain its effect.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Box model and testing\u003c/td>\u003ctd>Distinguish inner and outer spacing; identify an improvement and a preview, narrow-view or peer reading test.\u003c/td>\u003ctd>Label a paper box model, then change it in a browser.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>Observe more than a score\u003c/h2>\n\u003cp>The lab samples body and h1 contrast, font size, line height, section spacing and link underlining. It does not assess every background, nested area or meaning. Add keyboard, narrow-view and actual reading tests.\u003c/p>\n\u003ch2>Deciding the next teaching step\u003c/h2>\n\u003cp>If students can copy a template but cannot explain it, predict the effect of a new rule next lesson. Revisit padding and margin with the box diagram if needed. If file handling is the main barrier, practise backup and import first so students can keep their work.\u003c/p>\n\u003cp class=\"footer\">Paper work assesses concepts and design. Browser display, images, links and exports must be tested when devices recover.\u003c/p>\n\u003c/section>\u003c/body>\u003c/html>\n","starter.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-HK\">\n\u003chead>\u003clink rel=\"icon\" href=\"data:,\">\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>我的 Portfolio\u003c/title>\n\u003c/head>\n\u003cbody>\n  \u003c!-- 以別名或虛構角色創作；不用寫電話、地址或真實姓名。 -->\n  \u003ch1>請填上你的 Portfolio 標題\u003c/h1>\n  \u003cp>請填上兩句介紹，例如興趣和想學會的技能。\u003c/p>\n  \u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NDAiIGhlaWdodD0iMjgwIiB2aWV3Qm94PSIwIDAgNjQwIDI4MCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSLlsbHohIroiIfml6Xlh7rnmoTnt7Tnv5Lmj5LlnJYiPjxyZWN0IHdpZHRoPSI2NDAiIGhlaWdodD0iMjgwIiBmaWxsPSIjZWVmM2Y0Ii8+PGNpcmNsZSBjeD0iNDkxIiBjeT0iNzUiIHI9IjMxIiBmaWxsPSIjZDNkZmRmIi8+PHBhdGggZD0ibTAgMjM1IDE1NS0xNDEgMTM2IDk3IDEyMy03NyAxMTIgOTcgNTUtMjUgNTkgMzV2NTlIMFoiIGZpbGw9IiNiOGM5YzkiLz48cGF0aCBkPSJtMCAyNjAgMTMzLTc5IDE0NiA3MyAxMzMtNjYgMTM5IDYwIDg5LTM1djY3SDBaIiBmaWxsPSIjOTBhZWFhIi8+PC9zdmc+Cg==\" alt=\"\" width=\"320\">\n  \u003c!-- 任務：替圖片寫描述，再讓以下連結前往 #projects。 -->\n  \u003cp>\u003ca>看看我的作品\u003c/a>\u003c/p>\n  \u003csection id=\"projects\">\n    \u003ch2>我的作品\u003c/h2>\n    \u003cp>這是我第一個網頁作品。\u003c/p>\n  \u003c/section>\n\u003c/body>\n\u003c/html>","starter.en.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\u003clink rel=\"icon\" href=\"data:,\">\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>My Portfolio\u003c/title>\n\u003c/head>\n\u003cbody>\n  \u003c!-- Use an alias or fictional character. Do not include phone numbers or home addresses. -->\n  \u003ch1>Add your portfolio title\u003c/h1>\n  \u003cp>Write two sentences about your interests and a skill you want to learn.\u003c/p>\n  \u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NDAiIGhlaWdodD0iMjgwIiB2aWV3Qm94PSIwIDAgNjQwIDI4MCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSLlsbHohIroiIfml6Xlh7rnmoTnt7Tnv5Lmj5LlnJYiPjxyZWN0IHdpZHRoPSI2NDAiIGhlaWdodD0iMjgwIiBmaWxsPSIjZWVmM2Y0Ii8+PGNpcmNsZSBjeD0iNDkxIiBjeT0iNzUiIHI9IjMxIiBmaWxsPSIjZDNkZmRmIi8+PHBhdGggZD0ibTAgMjM1IDE1NS0xNDEgMTM2IDk3IDEyMy03NyAxMTIgOTcgNTUtMjUgNTkgMzV2NTlIMFoiIGZpbGw9IiNiOGM5YzkiLz48cGF0aCBkPSJtMCAyNjAgMTMzLTc5IDE0NiA3MyAxMzMtNjYgMTM5IDYwIDg5LTM1djY3SDBaIiBmaWxsPSIjOTBhZWFhIi8+PC9zdmc+Cg==\" alt=\"\" width=\"320\">\n  \u003c!-- Task: describe the image, then link the text below to #projects. -->\n  \u003cp>\u003ca>View my projects\u003c/a>\u003c/p>\n  \u003csection id=\"projects\">\n    \u003ch2>My projects\u003c/h2>\n    \u003cp>This is my first web page.\u003c/p>\n  \u003c/section>\n\u003c/body>\n\u003c/html>"};
(function () {
  "use strict";
  const KEY="portfolio-lab.locale";
  let locale="zh";
  try {
    const query=new URLSearchParams(location.search).get("lang");
    const saved=localStorage.getItem(KEY);
    locale=query==="en"||query==="zh"?query:saved==="en"?"en":"zh";
  } catch(e) {
    try{locale=new URLSearchParams(location.search).get("lang")==="en"?"en":"zh";}catch(ignore){}
  }
  const missing=new Set();
  const content=()=>locale==="en"?window.LabContentEN:window.LabContent;
  function t(key){
    if(locale!=="en"||typeof key!=="string")return key;
    if(Object.hasOwn(window.LabMessagesEN||{},key))return window.LabMessagesEN[key];
    if(/\p{Script=Han}/u.test(key))missing.add(key);
    return key;
  }
  function setLocale(value){
    if(!["zh","en"].includes(value))return;
    locale=value;
    try{localStorage.setItem(KEY,value);}catch(e){}
    // Keep explicit language links/bookmarks in sync without changing the lesson route.
    try{
      const url=new URL(location.href);url.searchParams.set("lang",value);
      history.replaceState(null,"",url);
    }catch(e){}
  }
  function resource(path){
    if(locale!=="en")return path;
    return {"print/worksheet.html":"print/worksheet.en.html","print/teacher-key.html":"print/teacher-key.en.html","starter.html":"starter.en.html"}[path]||path;
  }
  function syncUntouched(project){
    const active=content(),other=locale==="en"?window.LabContent:window.LabContentEN;
    if(!active||!other)return;
    if(project.build.html===other.starter&&project.build.css===other.starterCSS)
      project.build={html:active.starter,css:active.starterCSS};
    for(const lesson of [1,2])project.practice[lesson].forEach((s,i)=>{
      const old=other.tasks[lesson][i],next=active.tasks[lesson][i];
      if(s.html===old.html&&s.css===old.css)project.practice[lesson][i]={html:next.html,css:next.css};
    });
  }
  window.LabI18n={
    KEY,t,content,setLocale,resource,syncUntouched,
    get locale(){return locale;},
    get languageTag(){return locale==="en"?"en":"zh-HK";},
    get dateLocale(){return locale==="en"?"en-HK":"zh-HK";},
    missing
  };
})();

  "同樣條件下，相同選擇器後出現的宣告會覆蓋前面的。一般的 id 選擇器比 class 更具優先度，class 又比元素選擇器高；繼承的樣式可被元素自己的規則取代。": "Under equal conditions, the later declaration with the same selector wins. In ordinary cases, an id selector has higher specificity than a class, and a class has higher specificity than an element selector. A rule on an element can override an inherited style.",
  "p { color: #333333; }\np { color: #17634b; }\n/* 段落最後是甚麼顏色？改一次再確認。 */": "p { color: #333333; }\np { color: #17634b; }\n/* What colour will the paragraph be? Change a value and test. */",

  "延伸挑戰：為一組段落加入 class=\"intro\"，只選取這組內容；或把相同 CSS 套用到第二個網頁，檢查兩頁是否一致。": "Extension: give a group of paragraphs class=\"intro\" and select only that group, or apply the same CSS to a second page and check consistency.",

  "一個主標題、一段介紹、一張有替代文字的內容圖、一條可用連結；保存並匯出。可用別名或虛構角色。": "One main heading, an introduction, a content image with alternative text and a working link. Save and export. An alias or fictional character is welcome.",
  "保留 HTML 元素；加入主題顏色、可讀文字、背景與留白。解釋一條 CSS 規則，並重新測試圖片與連結。": "Keep the HTML elements. Add a heading colour, readable text, a background and spacing. Explain one CSS rule and retest images and links.",

  "備份可跨電腦繼續編輯。匯出 HTML 內含圖片與 CSS，可直接開啟；教學預覽會阻止外部圖片與外部網站連結。": "Use a backup to continue on another computer. The exported HTML includes images and CSS and opens independently. The teaching preview blocks external images and external website links.",

  "切至 360px 窄畫面，留意字、圖片與連結；用 Tab 尋找連結。": "Switch to the 360px view. Check text, images and links, then use Tab to reach the link.",

  "想一想：alt 描述了甚麼？文字和圖片是否適合公開？外部連結若有使用，須另行點測。": "Ask yourself: what does alt describe? Is the content suitable to share? Test any external links separately.",

  "用 class 選取一組內容；加入 img { max-width: 100%; height: auto; }。試把同一套 CSS 套用到第二頁，說明一致樣式的好處。": "Select a group using class. Add img { max-width: 100%; height: auto; }. Try sharing the CSS with a second page and explain the benefit of consistent styling.",

  "課前準備與成功準則": "Preparation and success criteria",
  "學生具備一般瀏覽和檔案操作能力，並已在必修部分單元 C(c) Elementary Web Authoring 認識基本 HTML 結構，但不必背誦 HTML 代碼，多數未曾親手編寫；本課由辨認推進到編寫。一人一機及教師投影。可用繁體中文介紹，保留英文標籤和術語。": "Students have basic browsing and file skills. In Compulsory Part Module C(c), Elementary Web Authoring, they learned to recognise the basic constructs of HTML but were not required to memorise HTML codes, and most have not written HTML by hand. This lesson moves them from recognising HTML to writing it. Plan one device per student and a teacher display. Choose the Chinese or English interface while retaining the HTML/CSS terms.",
  "課前預先下載離線單檔或整個教材資料夾；每部電腦試開、試保存及匯出。打印工作紙與答案。": "Download the standalone lab or full folder before class. Test opening, saving and exporting on each computer. Print worksheets and answers.",
  "準備一份教師樣本。學生可預備短介紹與授權圖片；未準備者用虛構角色及 mountain.svg。": "Prepare a teacher example. Students may bring a short introduction and permitted image; otherwise use a fictional character and mountain.svg.",
  "第一課：口頭提問中解釋 h1、p、img、a 至少三項；建立四元素草稿；修正一個錯誤並說明測試方法；給一項具體回饋。": "Lesson 1: explain at least three of h1, p, img and a in oral questioning; create the four-element draft; fix one error and explain the test; give one specific suggestion.",
  "第二課：解釋選擇器、屬性和值；在同一草稿加入顏色、字體、背景與盒模型；以預覽和同伴測試說明閱讀改善。": "Lesson 2: explain selector, property and value; add colour, typography, a background and box-model spacing to the same draft; explain readability improvements using preview and peer tests.",
  "第一課的 Build 只有 18 分鐘。優先讓學生完成標題和段落，再加內置圖與 #projects 連結。快完成者才加清單或第二個內容區。": "Lesson 1 allows only 18 minutes for Build. Prioritise the heading and paragraph, then the built-in image and #projects link. Add a list or second section only when the minimum draft is ready.",
  "Lesson 1 · HTML（70 分鐘）": "Lesson 1 · HTML (70 minutes)",

  "學生第一課作品會自動延續；換電腦則先匯入備份。": "Students continue their Lesson 1 work; import a backup when changing computers.",

  "三題診斷": "Three diagnostic questions",
  "標題、超連結、照片權利與私隱": "Headings, hyperlinks, image rights and privacy",
  "答案只留在學生的瀏覽器：教師巡視時閱讀螢幕，並請全班舉手（包括「記得必修部分哪些 HTML 標籤」），按結果調整示範重點。若分不清內容和樣式，先用對比例子口頭說明。": "Answers stay in each student's browser, so read screens while circulating and take a show of hands (including which HTML tags students remember from the Compulsory Part). Adjust the demonstration to what you find. If content and styling are confused, explain the contrasting examples orally first.",
  "常見標籤、路徑、href、有效 CSS": "Common tags, paths, href and valid CSS",
  "讓學生先指出錯誤，再取下一層提示；不要直接代打。": "Ask students to identify the problem before taking another hint. Explain rather than typing for them.",
  "源碼、即時預覽、獨立匯出檔": "Source, live preview and an independently opened export",
  "自動檢查只作形成性回饋。教師另外檢視內容、圖片描述與實際功能。": "Automatic checks provide formative feedback. The teacher also reviews content, image descriptions and actual functionality.",
  "能否解釋一項選擇，提出具體且尊重的建議": "An explained choice and a specific, respectful suggestion",
  "要求「我看到…所以建議…」，避免只說好看。": "Use 'I noticed ... so I suggest ...' rather than a general comment about appearance.",
  "獨立解釋與除錯，能否遷移到新例子": "Independent explanation, debugging and transfer to a new example",
  "學生下載學習紀錄，連同匯出的 HTML 按學校慣常方式提交；教師在下一課前閱讀。若多名學生仍混淆 href/src 或選擇器，下一課先示範再讓學生重試。": "Students download their learning record and submit it with the exported HTML through the school's usual channel; read these before the next lesson. If several students still confuse href/src or selectors, model the idea again at the start of the next lesson and let them retry.",
  "小測可自行重試；Exit Ticket 由教師閱卷。答案、口頭提問建議及簡短評閱準則見教師答案。可下載學習紀錄，由學生按學校既有方式提交。沒有線上收集服務。": "Students may retry the quiz; the teacher reviews Exit Tickets. The teacher answers include oral prompts and brief assessment guidance. Students can download a record and submit it through the school's usual method. There is no online collection service.",
  "鷹架、分層與正面課堂管理": "Scaffolding, differentiation and positive classroom management",
  "示範 → 元素對照 → 引導修改 → 半成品 → 獨立作品。三層提示由方向到例子；課堂規範是先按一次檢查，再取下一層提示。教材不會強制這個次序，教師巡視時留意學生取用提示的情況。": "Model, match elements to source, guide edits, use a starter, then create independently. Hints progress from direction to example. The classroom rule is to check your work first, then take one hint. The lab does not enforce this order, so watch hint use while circulating.",
  "需要支援：提供標籤參考、內置素材和同伴口頭解釋；先達成最少成果。能力較高：加清單、第二區或 class 選擇器。": "Support: offer a tag reference, built-in materials and oral peer explanations. Meet the minimum outcome first. Extension: add lists, another section or a class selector.",
  "建立「先看預覽 → 查提示 → 問伙伴 → 問老師」程序。投影當前步驟和剩餘時間；巡視時先處理無法開始的學生。": "Establish a routine: inspect the preview, check a hint, ask a partner, then ask the teacher. Display the current step and remaining time. Visit students who cannot get started first.",
  "伙伴可以解釋，不替對方控制鍵盤。共用電腦時每 5 分鐘交換操作／檢查角色；兩人各自完成 Exit Ticket。": "Partners may explain without taking over the keyboard. When sharing a device, swap editing and checking roles every five minutes; each student completes an individual Exit Ticket.",
  "針對具體進步給回饋；對離題操作先靠近和私下提醒，讓學生知道下一個可完成的小步驟。": "Give feedback on specific progress. For off-task behaviour, move closer and redirect privately where possible, identifying the next manageable step.",
  "教學依據：Gagné 的教學事件用於導入、目標、回憶、示範、實作、回饋和遷移；鷹架把支援由示範逐步減少；形成性評估用於決定下一步。這些是教學設計理由，並非此網站已證實提升學習成績的研究結論。": "Rationale: Gagne's instructional events guide attention, goals, recall, modelling, practice, feedback and transfer. Scaffolding gradually reduces support, while formative assessment informs the next step. These are design rationales, not research evidence that this website has improved attainment.",

  "第二課全班設備故障：0–8 重溫 HTML、8–20 讀 CSS 規則、20–35 預測與除錯、35–55 在草稿加 CSS、55–65 同伴說明與回饋、65–70 Exit Ticket；之後必須補做瀏覽器測試。": "For a Lesson 2 class-wide failure: 0–8 review HTML; 8–20 read CSS rules; 20–35 predict and debug; 35–55 add CSS to the draft; 55–65 explain and review with a partner; 65–70 complete an Exit Ticket. Follow up with browser tests when devices recover.",

    app.replaceChildren(...shell());
    document.title="Portfolio Lab · "+(route==="teacher"?tr("教師指引"):route==="resources"?tr("作品與離線"):"Lesson "+lesson+" "+route);
    if(focus){window.scrollTo(0,0);document.getElementById("main")?.focus({preventScroll:true});}
  }
  readHash();render();
  // In-page teacher anchors are separate from lesson routes.
  document.addEventListener("click",event=>{
    const a=event.target.closest("a");
    if(a?.getAttribute("href")==="#main"){event.preventDefault();document.getElementById("main")?.focus();return;}
    if(a?.getAttribute("href")?.startsWith("#teacher-")){
      event.preventDefault();document.getElementById(a.getAttribute("href").slice(1))?.scrollIntoView();
    }
  });
})();
</script></body>
</html>
